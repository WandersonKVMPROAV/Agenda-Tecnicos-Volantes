<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KVM Pro AV · Agenda de Técnicos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#1C7A88;
    --teal-dark:#125A66;
    --teal-tint:#E4F1F2;
    --navy:#2E4756;
    --navy-tint:#E9EDEF;
    --gold:#D9A04B;
    --gold-tint:#FBF0DE;
    --sage:#4C8B6E;
    --sage-tint:#E4F0EA;
    --plum:#6B5CA5;
    --plum-tint:#ECE8F5;
    --terracotta:#C1584B;
    --terracotta-tint:#F8E7E4;
    --bg:#F5F7F6;
    --surface:#FFFFFF;
    --border:#E1E7E6;
    --text:#20303A;
    --text-muted:#657078;
    --radius-sm:8px;
    --radius-md:12px;
    --radius-lg:18px;
    --shadow-1: 0 1px 2px rgba(32,48,58,.06);
    --shadow-2: 0 8px 24px rgba(32,48,58,.10);
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:inherit;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100%;
  }
  h1,h2,h3,.font-display{font-family:'Space Grotesk',system-ui,sans-serif;}
  button{font-family:inherit;}
  a{color:inherit;}

  /* ---------- Top bar ---------- */
  .topbar{
    background:var(--surface);
    border-bottom:1px solid var(--border);
    padding:14px 20px;
    display:flex;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
    position:sticky;
    top:env(safe-area-inset-top,0px);
    z-index:30;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    padding-right:16px;
    border-right:1px solid var(--border);
  }
  .brand img{height:28px;width:auto;display:block;}
  .view-tabs{
    display:flex;
    gap:4px;
    background:var(--bg);
    padding:4px;
    border-radius:999px;
    border:1px solid var(--border);
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
  }
  .view-tab{
    border:none;
    background:transparent;
    padding:7px 14px;
    border-radius:999px;
    font-size:13.5px;
    font-weight:600;
    color:var(--text-muted);
    cursor:pointer;
    white-space:nowrap;
    transition:background .15s ease, color .15s ease;
  }
  .view-tab:hover{color:var(--text);}
  .view-tab.active{
    background:var(--navy);
    color:#fff;
  }
  .topbar-right{
    display:flex;
    align-items:center;
    gap:8px;
    margin-left:auto;
    flex-wrap:wrap;
  }
  select, .btn, input, textarea{
    font-family:inherit;
    font-size:13.5px;
  }
  select.filter-select{
    border:1px solid var(--border);
    background:var(--surface);
    padding:8px 12px;
    border-radius:var(--radius-sm);
    color:var(--text);
    font-weight:500;
    cursor:pointer;
    max-width:180px;
  }
  .btn{
    border:none;
    padding:9px 16px;
    border-radius:var(--radius-sm);
    font-weight:600;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
    transition:transform .1s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn-primary{ background:var(--teal); color:#fff; }
  .btn-primary:hover{background:var(--teal-dark);}
  .btn-ghost{ background:transparent; color:var(--text); border:1px solid var(--border); }
  .btn-ghost:hover{background:var(--bg);}
  .btn-sm{padding:6px 11px;font-size:12.5px;}
  .btn:active{transform:scale(.97);}

  /* ---------- Layout ---------- */
  main{ max-width:1240px; margin:0 auto; padding:22px 20px 60px; }
  .panel-head{
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:12px; margin-bottom:16px;
  }
  .date-nav{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .date-nav button.nav-round{
    width:32px;height:32px; border-radius:50%;
    border:1px solid var(--border); background:var(--surface);
    cursor:pointer; display:flex;align-items:center;justify-content:center;
    color:var(--text); font-size:15px;
  }
  .date-nav button.nav-round:hover{background:var(--bg);}
  .date-label{
    font-size:18px; font-weight:600; font-family:'Space Grotesk',sans-serif;
    text-transform:capitalize; min-width:170px;
  }
  .legend{ display:flex; gap:14px; flex-wrap:wrap; font-size:12.5px; color:var(--text-muted); }
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;}

  /* ---------- Badges ---------- */
  .status-badge{
    display:inline-block; font-size:10.5px; font-weight:700;
    padding:2px 8px; border-radius:999px; text-transform:uppercase; letter-spacing:.02em;
    white-space:nowrap;
  }
  .status-disponivel{background:var(--sage-tint);color:#2E5F45;}
  .status-andamento{background:var(--gold-tint);color:#8A6318;}
  .status-finalizado{background:var(--teal-tint);color:var(--teal-dark);}
  .status-provisionado{background:var(--plum-tint);color:#4B3E80;}

  .coverage-tag{
    display:inline-flex; align-items:center; gap:4px;
    font-size:11px; font-weight:600; color:var(--text-muted);
    background:var(--bg); border:1px solid var(--border);
    padding:2px 8px; border-radius:999px; white-space:nowrap;
  }

  /* ---------- Assignment row (used in Daily + List) ---------- */
  .assignment-row{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-sm); padding:12px 14px; margin-bottom:9px;
    cursor:pointer; box-shadow:var(--shadow-1);
  }
  .assignment-row:hover{box-shadow:var(--shadow-2);}
  .ar-period{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:13px;
    color:var(--navy); min-width:112px;
  }
  .ar-period small{display:block;font-weight:500;color:var(--text-muted);font-size:10.5px;}
  .ar-main{flex:1;min-width:180px;}
  .ar-main .a-title{font-weight:700;font-size:13.5px;}
  .ar-main .a-meta{font-size:12px;color:var(--text-muted);margin-top:2px;}
  .tech-chip{
    display:inline-flex; align-items:center; gap:6px;
    font-size:12px; font-weight:700; color:#fff;
    padding:3px 10px; border-radius:999px; white-space:nowrap;
  }
  .ar-tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}

  /* ---------- Weekly view ---------- */
  .week-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:10px; }
  .week-day{
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-md); min-height:180px; padding:10px;
    box-shadow:var(--shadow-1);
  }
  .week-day.is-today{border-color:var(--teal); box-shadow:0 0 0 2px var(--teal-tint) inset;}
  .week-day-head{
    font-size:12px; color:var(--text-muted); font-weight:700;
    text-transform:uppercase; letter-spacing:.03em; margin-bottom:2px;
  }
  .week-day-num{ font-family:'Space Grotesk',sans-serif; font-size:19px; font-weight:700; margin-bottom:8px; }
  .week-chip{
    border-radius:6px; padding:6px 8px; font-size:11px; margin-bottom:6px; cursor:pointer;
    border-left:3px solid var(--teal); background:var(--bg);
  }
  .week-chip .a-title{font-weight:700;display:block;}
  .week-chip .a-tech{color:var(--text-muted);}

  /* ---------- Monthly view ---------- */
  .month-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
  .month-weekday-head{
    font-size:11.5px; font-weight:700; color:var(--text-muted);
    text-transform:uppercase; letter-spacing:.03em; text-align:center; padding-bottom:4px;
  }
  .month-cell{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm);
    min-height:100px; padding:8px; cursor:pointer; transition:background .12s ease;
  }
  .month-cell:hover{background:var(--teal-tint);}
  .month-cell.other-month{opacity:.42;}
  .month-cell.is-today{border-color:var(--teal);border-width:2px;}
  .month-cell-num{font-weight:700;font-size:13px;margin-bottom:6px;font-family:'Space Grotesk',sans-serif;}
  .month-dots{display:flex;flex-wrap:wrap;gap:4px;}
  .month-dots .dot{width:7px;height:7px;}
  .month-more{font-size:10.5px;color:var(--text-muted);margin-top:3px;}

  /* ---------- List view ---------- */
  .list-group{margin-bottom:20px;}
  .list-month-head{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14.5px;
    text-transform:capitalize; color:var(--navy); margin-bottom:8px;
    padding-bottom:6px; border-bottom:2px solid var(--border);
  }

  /* ---------- Kanban ---------- */
  .kanban-board{
    display:grid; grid-template-columns:repeat(4,minmax(230px,1fr)); gap:14px;
    overflow-x:auto; padding-bottom:8px;
  }
  .kanban-col{ background:#EEF2F1; border-radius:var(--radius-md); padding:12px; min-height:200px; }
  .kanban-col-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:10px; font-weight:700; font-size:13px;
  }
  .kanban-count{ background:#fff; border-radius:999px; padding:1px 8px; font-size:11.5px; color:var(--text-muted); }
  .kanban-card{
    background:var(--surface); border-radius:var(--radius-sm); border:1px solid var(--border);
    padding:10px 11px; margin-bottom:9px; cursor:grab; box-shadow:var(--shadow-1);
  }
  .kanban-card:active{cursor:grabbing;}
  .kanban-card.dragging{opacity:.4;}
  .kanban-col.drag-over{background:#E2EAE8;}
  .kanban-card .a-title{font-weight:700;font-size:13px;margin-bottom:4px;}
  .kanban-card .a-meta{font-size:11.5px;color:var(--text-muted);margin-bottom:5px;}

  /* ---------- Empty state ---------- */
  .empty-state{ text-align:center; padding:60px 20px; color:var(--text-muted); }
  .empty-state .icon{font-size:34px;margin-bottom:10px;}

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed;inset:0; background:rgba(32,48,58,.45);
    display:none; align-items:flex-start; justify-content:center;
    padding:40px 16px; overflow-y:auto; z-index:100;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--surface); border-radius:var(--radius-lg); width:100%; max-width:500px;
    padding:22px 22px 20px; box-shadow:var(--shadow-2);
  }
  .modal h3{margin:0 0 16px;font-size:18px;}
  .field{margin-bottom:13px;}
  .field label{ display:block; font-size:12.5px; font-weight:600; color:var(--text-muted); margin-bottom:5px; }
  .field input, .field select, .field textarea{
    width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:var(--radius-sm);
    background:var(--bg); color:var(--text);
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:2px solid var(--teal); outline-offset:1px; background:var(--surface);
  }
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  #detailBody .field > div{font-size:14px;color:var(--text);line-height:1.4;}
  .modal-actions{ display:flex; justify-content:space-between; align-items:center; margin-top:18px; gap:10px; }
  .modal-actions .right{display:flex;gap:8px;}
  textarea{resize:vertical;min-height:56px;}

  .banner{ background:var(--navy); color:#fff; font-size:12.5px; padding:9px 20px; text-align:center; }
  .banner b{color:var(--gold);}

  @media (max-width:760px){
    .week-grid{grid-template-columns:repeat(7,minmax(120px,1fr));overflow-x:auto;}
    .month-grid{grid-template-columns:repeat(7,minmax(64px,1fr));overflow-x:auto;}
    .kanban-board{grid-template-columns:repeat(4,minmax(200px,1fr));}
    .topbar{gap:10px;}
    .date-label{font-size:16px;min-width:auto;}
    .field-row{grid-template-columns:1fr;}
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F1517; --surface:#182024; --border:#283134; --text:#EAF0EF; --text-muted:#8B9A9E;
      --teal-tint:#0F3339; --gold-tint:#332714; --sage-tint:#173023; --plum-tint:#251F38; --terracotta-tint:#331715;
    }
    :root:not([data-theme="light"]) .kanban-col{background:#1D2629;}
    :root:not([data-theme="light"]) .kanban-col.drag-over{background:#26312F;}
    :root:not([data-theme="light"]) .week-chip{background:#1D2629;}
  }
  :root[data-theme="dark"]{
    --bg:#0F1517; --surface:#182024; --border:#283134; --text:#EAF0EF; --text-muted:#8B9A9E;
    --teal-tint:#0F3339; --gold-tint:#332714; --sage-tint:#173023; --plum-tint:#251F38; --terracotta-tint:#331715;
  }
  :root[data-theme="dark"] .kanban-col{background:#1D2629;}
  :root[data-theme="dark"] .kanban-col.drag-over{background:#26312F;}
  :root[data-theme="dark"] .week-chip{background:#1D2629;}
</style>
</head>

<div class="overlay" id="overlay">

          <select id="f-tech" required></select>
        </div>
        <div class="field">
          <label for="f-status">Status</label>
          <select id="f-status">

            <option value="andamento">Em andamento</option>
            <option value="finalizado">Finalizado</option>
            <option value="provisionado">Provisionado</option>

      <div class="field">

        <input id="f-site" placeholder="Ex.: Sede, Farol, CEIC...">

        <div>

          <input id="f-start" type="date" required>
        </div>
        <div>
          <label for="f-end">Data fim</label>
          <input id="f-end" type="date" required>
        </div>
      </div>
      <div class="field">
        <label for="f-coverage">Tipo de cobertura</label>
        <select id="f-coverage">
          <option value="atestado">Atestado</option>
          <option value="dayoff">Dayoff</option>
          <option value="falta">Falta</option>
          <option value="ferias">Férias</option>
          <option value="treinamento">Treinamento</option>
        </select>
      </div>
      <div class="field">
        <label for="f-responsible">Responsável</label>
        <input id="f-responsible" placeholder="Ex.: Adriely">
      </div>
      <div class="field">
        <label for="f-notes">Observações</label>
        <textarea id="f-notes" placeholder="Detalhes do período..."></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="btnDelete" style="display:none;color:#8E362B;">Excluir</button>
        <div class="right">
          <button type="button" class="btn btn-ghost" id="btnCancel">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
      </div>
    </form>
  </div>

  var state = loadState();

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        if(parsed && parsed.technicians && parsed.assignments){ return parsed; }
      }
    }catch(e){}
    return {technicians: TECHNICIANS.slice(), assignments: DEFAULT_ASSIGNMENTS.slice()};
  }
  function saveState(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({technicians:state.technicians, assignments:state.assignments}));
    }catch(e){}
  }

  function techById(id){
    for(var i=0;i<state.technicians.length;i++){ if(state.technicians[i].id===id) return state.technicians[i]; }
    return {id:id, name:"—", color:"#999"};
  }
  function fmtDateLong(str){
    var d = new Date(str+"T00:00:00");
    return d.getDate()+" de "+MONTH_NAMES[d.getMonth()]+" de "+d.getFullYear();
  }
  function fmtDateShort(str){
    var d = new Date(str+"T00:00:00");
    return WEEKDAY_NAMES[d.getDay()]+", "+d.getDate()+" "+MONTH_NAMES[d.getMonth()].slice(0,3);
  }
  function fmtDD_MM(str){
    var d = new Date(str+"T00:00:00");
    return pad(d.getDate())+"/"+pad(d.getMonth()+1);
  }
  function clientLabel(a){
    return a.site ? (a.client+" · "+a.site) : a.client;
  }

  function visibleAssignments(){
    var list = state.assignments.slice();
    if(state.techFilter !== "all"){ list = list.filter(function(a){ return a.techId === state.techFilter; }); }
    if(state.coverageFilter !== "all"){ list = list.filter(function(a){ return a.coverage === state.coverageFilter; }); }
    return list;
  }
  function isActiveOn(a, dateStr){ return a.start <= dateStr && dateStr <= a.end; }
  function assignmentsForDate(dateStr){
    return visibleAssignments().filter(function(a){ return isActiveOn(a, dateStr); })
      .sort(function(a,b){ return a.start.localeCompare(b.start); });
  }

  function renderTabs(){

      var b = document.createElement("button");
      b.className = "view-tab" + (state.view===v.id ? " active":"");
      b.textContent = v.label;
      b.setAttribute("role","tab");
      b.setAttribute("aria-selected", state.view===v.id ? "true":"false");
      b.onclick = function(){ state.view = v.id; renderAll(); };
      wrap.appendChild(b);

  function renderFilters(){
    var sel = document.getElementById("techFilter");
    var opts = ['<option value="all">Todos os técnicos</option>'];

    sel.innerHTML = opts.join("");
    sel.value = state.techFilter;
    sel.onchange = function(){ state.techFilter = sel.value; renderAll(); };

    var covSel = document.getElementById("coverageFilter");

    });
    covSel.innerHTML = covOpts.join("");
    covSel.value = state.coverageFilter;
    covSel.onchange = function(){ state.coverageFilter = covSel.value; renderAll(); };

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function legendHtml(){

      '<span><i class="dot" style="background:var(--plum)"></i>Provisionado</span>' +

  function attachRowHandlers(root){

  /* ============ Vista Diária ============ */
  function renderDaily(container){
    var head = document.createElement("div");
    head.className = "panel-head";
    head.innerHTML =
      '<div class="date-nav">' +
        '<button class="nav-round" id="prevDay" aria-label="Dia anterior">‹</button>' +
        '<div class="date-label">'+fmtDateShort(state.currentDate)+'</div>' +
        '<button class="nav-round" id="nextDay" aria-label="Próximo dia">›</button>' +
        '<button class="btn btn-ghost btn-sm" id="todayBtn">Hoje</button>' +
      '</div>' + legendHtml();
    container.appendChild(head);

    var acts = assignmentsForDate(state.currentDate);
    if(acts.length===0){
      var empty = document.createElement("div");
      empty.className = "empty-state";
      empty.innerHTML = '<div class="icon">📭</div>Nenhum técnico com período ativo nesta data.';
      container.appendChild(empty);
    } else {
      var list = document.createElement("div");
      list.innerHTML = acts.map(assignmentRowHtml).join("");
      container.appendChild(list);
    }
    attachRowHandlers(container);
    document.getElementById("prevDay").onclick = function(){ state.currentDate = addDaysToStr(state.currentDate,-1); renderAll(); };
    document.getElementById("nextDay").onclick = function(){ state.currentDate = addDaysToStr(state.currentDate,1); renderAll(); };
    document.getElementById("todayBtn").onclick = function(){ state.currentDate = T; renderAll(); };
  }

  /* ============ Vista Semanal ============ */
  function startOfWeek(dateStr){
    var d = new Date(dateStr+"T00:00:00");
    var day = d.getDay();
    var diff = (day===0? -6 : 1) - day;
    d.setDate(d.getDate()+diff);
    return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  }

  function renderWeekly(container){
    var start = startOfWeek(state.currentDate);
    var endOfWeek = addDaysToStr(start,6);
    var head = document.createElement("div");
    head.className = "panel-head";
    head.innerHTML =
      '<div class="date-nav">' +
        '<button class="nav-round" id="prevWeek" aria-label="Semana anterior">‹</button>' +
        '<div class="date-label">'+fmtDD_MM(start)+' – '+fmtDateLong(endOfWeek)+'</div>' +
        '<button class="nav-round" id="nextWeek" aria-label="Próxima semana">›</button>' +
        '<button class="btn btn-ghost btn-sm" id="todayBtn">Hoje</button>' +
      '</div>' + legendHtml();
    container.appendChild(head);

    var grid = document.createElement("div");
    grid.className = "week-grid";
    for(var i=0;i<7;i++){
      var dateStr = addDaysToStr(start,i);
      var d = new Date(dateStr+"T00:00:00");
      var acts = assignmentsForDate(dateStr);
      var col = document.createElement("div");
      col.className = "week-day" + (dateStr===T ? " is-today":"");
      col.innerHTML =
        '<div class="week-day-head">'+WEEKDAY_NAMES[d.getDay()]+'</div>' +
        '<div class="week-day-num">'+d.getDate()+'</div>' +
        acts.map(function(a){
          var tech = techById(a.techId);
          return '<div class="week-chip" style="border-left-color:'+STATUS_COLOR[a.status]+'" data-id="'+a.id+'">' +
            '<span class="a-title">'+escapeHtml(clientLabel(a))+'</span>' +
            '<span class="a-tech">'+COVERAGE_ICON[a.coverage]+' '+escapeHtml(tech.name)+'</span>' +
          '</div>';
        }).join("");
      grid.appendChild(col);
    }
    container.appendChild(grid);
    attachRowHandlers(container);
    document.getElementById("prevWeek").onclick = function(){ state.currentDate = addDaysToStr(state.currentDate,-7); renderAll(); };
    document.getElementById("nextWeek").onclick = function(){ state.currentDate = addDaysToStr(state.currentDate,7); renderAll(); };
    document.getElementById("todayBtn").onclick = function(){ state.currentDate = T; renderAll(); };
  }

  /* ============ Vista Mensal ============ */
  function renderMonthly(container){
    var d = new Date(state.currentDate+"T00:00:00");
    var year = d.getFullYear(), month = d.getMonth();

    var head = document.createElement("div");
    head.className = "panel-head";
    head.innerHTML =
      '<div class="date-nav">' +
        '<button class="nav-round" id="prevMonth" aria-label="Mês anterior">‹</button>' +
        '<div class="date-label">'+MONTH_NAMES[month]+' de '+year+'</div>' +
        '<button class="nav-round" id="nextMonth" aria-label="Próximo mês">›</button>' +
        '<button class="btn btn-ghost btn-sm" id="todayBtn">Hoje</button>' +
      '</div>' + legendHtml();
    container.appendChild(head);

    var grid = document.createElement("div");
    grid.className = "month-grid";
    WEEKDAY_NAMES.forEach(function(w){
      var el = document.createElement("div");
      el.className = "month-weekday-head";
      el.textContent = w;
      grid.appendChild(el);
    });

    var firstOfMonth = new Date(year, month, 1);
    var startOffset = firstOfMonth.getDay();
    var gridStart = new Date(year, month, 1 - startOffset);

    for(var i=0;i<42;i++){
      var cellDate = new Date(gridStart);
      cellDate.setDate(gridStart.getDate()+i);
      var cellStr = cellDate.getFullYear()+"-"+pad(cellDate.getMonth()+1)+"-"+pad(cellDate.getDate());
      var acts = assignmentsForDate(cellStr);
      var cell = document.createElement("div");
      cell.className = "month-cell" +
        (cellDate.getMonth()!==month ? " other-month":"") +
        (cellStr===T ? " is-today":"");
      var dotsHtml = acts.slice(0,8).map(function(a){
        return '<span class="dot" style="background:'+STATUS_COLOR[a.status]+'" title="'+escapeHtml(techById(a.techId).name)+'"></span>';
      }).join("");
      cell.innerHTML =
        '<div class="month-cell-num">'+cellDate.getDate()+'</div>' +
        '<div class="month-dots">'+dotsHtml+'</div>' +
        (acts.length ? '<div class="month-more">'+acts.length+' técnico'+(acts.length>1?'s':'')+'</div>' : '');
      (function(str){
        cell.onclick = function(){ state.currentDate = str; state.view = "daily"; renderAll(); };
      })(cellStr);
      grid.appendChild(cell);
    }
    container.appendChild(grid);
    document.getElementById("prevMonth").onclick = function(){
      var nd = new Date(year, month-1, 1);
      state.currentDate = nd.getFullYear()+"-"+pad(nd.getMonth()+1)+"-01";
      renderAll();
    };
    document.getElementById("nextMonth").onclick = function(){
      var nd = new Date(year, month+1, 1);
      state.currentDate = nd.getFullYear()+"-"+pad(nd.getMonth()+1)+"-01";
      renderAll();
    };
    document.getElementById("todayBtn").onclick = function(){ state.currentDate = T; renderAll(); };
  }

  /* ============ Vista Lista ============ */
  function renderList(container){
    var head = document.createElement("div");
    head.className = "panel-head";
    head.innerHTML = '<div class="date-label" style="font-size:16px;">Todos os períodos</div>' + legendHtml();
    container.appendChild(head);

    var acts = visibleAssignments().slice().sort(function(a,b){ return a.start.localeCompare(b.start); });

    if(acts.length===0){
      var empty = document.createElement("div");
      empty.className = "empty-state";
      empty.innerHTML = '<div class="icon">📭</div>Nenhum período encontrado.';
      container.appendChild(empty);
      return;
    }

    var byMonth = {}; var order = [];
    acts.forEach(function(a){
      var d = new Date(a.start+"T00:00:00");
      var key = d.getFullYear()+"-"+pad(d.getMonth()+1);
      if(!byMonth[key]){ byMonth[key]=[]; order.push(key); }
      byMonth[key].push(a);
    });

    order.forEach(function(key){
      var parts = key.split("-");
      var label = MONTH_NAMES[parseInt(parts[1],10)-1] + " de " + parts[0];
      var group = document.createElement("div");
      group.className = "list-group";
      group.innerHTML = '<div class="list-month-head">'+label+'</div>' + byMonth[key].map(assignmentRowHtml).join("");
      container.appendChild(group);
    });
    attachRowHandlers(container);
  }

  /* ============ Vista Kanban ============ */
  var dragState = {id:null};

  function renderKanban(container){
    var head = document.createElement("div");
    head.className = "panel-head";
    var hint = READ_ONLY ? "Toque em um card para ver os detalhes" : "Arraste os cards para mudar o status";
    head.innerHTML = '<div class="date-label" style="font-size:16px;">Kanban por status</div><div class="legend"><span>'+hint+'</span></div>';
    container.appendChild(head);

    var acts = visibleAssignments();
    var board = document.createElement("div");
    board.className = "kanban-board";

    STATUS_ORDER.forEach(function(st){
      var col = document.createElement("div");
      col.className = "kanban-col";
      col.setAttribute("data-status", st);
      var colActs = acts.filter(function(a){ return a.status===st; })
        .sort(function(a,b){ return a.start.localeCompare(b.start); });
      col.innerHTML = '<div class="kanban-col-head"><span style="color:'+STATUS_COLOR[st]+'">'+STATUS_LABELS[st]+'</span><span class="kanban-count">'+colActs.length+'</span></div>' +
        colActs.map(function(a){
          var tech = techById(a.techId);
          return '<div class="kanban-card"'+(READ_ONLY? '' : ' draggable="true"')+' data-id="'+a.id+'">' +
            '<div class="a-title">'+escapeHtml(clientLabel(a))+'</div>' +
            '<div class="a-meta">'+fmtDD_MM(a.start)+' – '+fmtDD_MM(a.end)+' · '+COVERAGE_ICON[a.coverage]+' '+COVERAGE_LABELS[a.coverage]+'</div>' +
            '<span class="tech-chip" style="background:'+tech.color+'">'+escapeHtml(tech.name)+'</span>' +
          '</div>';
        }).join("");
      board.appendChild(col);
    });

    container.appendChild(board);
    attachRowHandlers(container);

    if(READ_ONLY) return;

    board.querySelectorAll(".kanban-card").forEach(function(card){
      card.addEventListener("dragstart", function(e){
        dragState.id = card.getAttribute("data-id");
        card.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
      });
      card.addEventListener("dragend", function(){ card.classList.remove("dragging"); });
    });
    board.querySelectorAll(".kanban-col").forEach(function(col){
      col.addEventListener("dragover", function(e){ e.preventDefault(); col.classList.add("drag-over"); });
      col.addEventListener("dragleave", function(){ col.classList.remove("drag-over"); });
      col.addEventListener("drop", function(e){
        e.preventDefault();
        col.classList.remove("drag-over");
        var id = dragState.id;
        var newStatus = col.getAttribute("data-status");
        var act = state.assignments.find(function(a){ return a.id===id; });
        if(act && newStatus){ act.status = newStatus; saveState(); renderAll(); }
      });
    });
  }

  /* ============ Render principal ============ */
  function renderAll(){
    renderTabs();
    renderFilters();
    var app = document.getElementById("app");
    app.innerHTML = "";
    if(state.view==="daily") renderDaily(app);
    else if(state.view==="weekly") renderWeekly(app);
    else if(state.view==="monthly") renderMonthly(app);
    else if(state.view==="list") renderList(app);
    else if(state.view==="kanban") renderKanban(app);
  }

        '<span class="tech-chip" style="background:'+tech.color+'">'+escapeHtml(tech.name)+'</span></div>' +
      '<div class="field"><label>Cliente</label><div>'+escapeHtml(clientLabel(a))+'</div></div>' +
      '<div class="field-row">' +
        '<div class="field"><label>Data início</label><div>'+fmtDateLong(a.start)+'</div></div>' +
        '<div class="field"><label>Data fim</label><div>'+fmtDateLong(a.end)+'</div></div>' +
      '</div>' +
      '<div class="field"><label>Status</label><div><span class="status-badge status-'+a.status+'">'+STATUS_LABELS[a.status]+'</span></div></div>' +
      '<div class="field"><label>Tipo de cobertura</label><div><span class="coverage-tag">'+COVERAGE_ICON[a.coverage]+' '+COVERAGE_LABELS[a.coverage]+'</span></div></div>' +
      '<div class="field"><label>Responsável</label><div>'+escapeHtml(a.responsible||"—")+'</div></div>' +
      '<div class="field"><label>Observações</label><div>'+escapeHtml(a.notes||"—")+'</div></div>';
    overlay.classList.add("open");
  }

  function openModal(id){
    if(READ_ONLY){ openDetailModal(id); return; }
    document.getElementById("detailBody").style.display = "none";
    document.getElementById("detailActions").style.display = "none";
    document.getElementById("activityForm").style.display = "block";
    populateTechSelect();
    populateClientList();
    document.getElementById("btnDelete").style.display = id ? "inline-flex":"none";
    if(id){
      var a = state.assignments.find(function(x){ return x.id===id; });
      if(!a) return;
      state.editingId = id;
      document.getElementById("modalTitle").textContent = "Editar período";
      document.getElementById("f-tech").value = a.techId;
      document.getElementById("f-status").value = a.status;
      document.getElementById("f-client").value = a.client;
      document.getElementById("f-site").value = a.site||"";
      document.getElementById("f-start").value = a.start;
      document.getElementById("f-end").value = a.end;
      document.getElementById("f-coverage").value = a.coverage;
      document.getElementById("f-responsible").value = a.responsible||"";
      document.getElementById("f-notes").value = a.notes||"";
    } else {
      state.editingId = null;
      document.getElementById("modalTitle").textContent = "Novo período";
      form.reset();
      var d0 = (state.view==="daily"||state.view==="weekly") ? state.currentDate : T;
      document.getElementById("f-start").value = d0;
      document.getElementById("f-end").value = d0;
      document.getElementById("f-status").value = "provisionado";
      document.getElementById("f-coverage").value = "treinamento";
      if(state.techFilter!=="all") document.getElementById("f-tech").value = state.techFilter;
    }
    overlay.classList.add("open");
    setTimeout(function(){ document.getElementById("f-client").focus(); }, 30);
  }
  function closeModal(){ overlay.classList.remove("open"); state.editingId = null; }

  document.getElementById("btnCloseDetail").onclick = closeModal;
  if(!READ_ONLY) document.getElementById("btnNewActivity").onclick = function(){ openModal(null); };
  document.getElementById("btnCancel").onclick = closeModal;
  overlay.addEventListener("click", function(e){ if(e.target===overlay) closeModal(); });
  document.addEventListener("keydown", function(e){ if(e.key==="Escape" && overlay.classList.contains("open")) closeModal(); });

  document.getElementById("btnDelete").onclick = function(){
    if(!state.editingId) return;
    state.assignments = state.assignments.filter(function(a){ return a.id!==state.editingId; });
    saveState(); closeModal(); renderAll();
  };

  form.addEventListener("submit", function(e){
    e.preventDefault();
    var data = {
      techId: document.getElementById("f-tech").value,
      status: document.getElementById("f-status").value,
      client: document.getElementById("f-client").value.trim(),
      site: document.getElementById("f-site").value.trim(),
      start: document.getElementById("f-start").value,
      end: document.getElementById("f-end").value,
      coverage: document.getElementById("f-coverage").value,
      responsible: document.getElementById("f-responsible").value.trim(),
      notes: document.getElementById("f-notes").value.trim()
    };
    if(!data.client || !data.start || !data.end || !data.techId){ return; }
    if(data.end < data.start){ data.end = data.start; }
    if(state.editingId){
      var a = state.assignments.find(function(x){ return x.id===state.editingId; });
      Object.assign(a, data);
    } else {
      data.id = "c" + Date.now();
      state.assignments.push(data);
    }
    saveState(); closeModal(); renderAll();
  });

  /* ============ Modo de exibição / exportação ============ */
  if(READ_ONLY){
    document.getElementById("btnNewActivity").style.display = "none";
    document.getElementById("btnExport").style.display = "none";
    document.getElementById("protoBanner").innerHTML = '📋 <b>Agenda dos técnicos volantes</b> — consulta apenas. Toque em qualquer período para ver os detalhes completos.';
  } else {
    document.getElementById("protoBanner").innerHTML = '✏️ <b>Modo edição</b> — use "+ Novo período" para adicionar e clique em um card para editar. Quando terminar, use "Exportar para técnicos" para gerar a versão só leitura.';
    document.getElementById("btnExport").addEventListener("click", downloadViewerCopy);
  }

  function generateViewerHtml(){
    var html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
    var newAssignmentsJson = JSON.stringify(state.assignments);
    html = html.replace(
      /\/\*ASSIGNMENTS_JSON_START\*\/[\s\S]*?\/\*ASSIGNMENTS_JSON_END\*\//,
      "/*ASSIGNMENTS_JSON_START*/" + newAssignmentsJson + "/*ASSIGNMENTS_JSON_END*/"
    );
    html = html.replace(
      "var READ_ONLY = /*READ_ONLY_FLAG*/true/*READ_ONLY_FLAG*/;",
      "var READ_ONLY = /*READ_ONLY_FLAG*/true/*READ_ONLY_FLAG*/;"
    );
    return html;
  }

  function downloadViewerCopy(){
    try{
      var html = generateViewerHtml();
      var blob = new Blob([html], {type:"text/html"});
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "agenda-tecnicos-" + T + ".html";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
    }catch(e){
      alert("Não foi possível gerar o arquivo. Tente novamente ou use um navegador desktop (Chrome/Edge).");
    }
  }

  renderAll();

})();
</script>
</body>
</html>
