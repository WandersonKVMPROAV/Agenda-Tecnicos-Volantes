<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KVM Pro AV · Agenda de Técnicos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#1C7A88;
    --teal-dark:#125A66;
    --teal-tint:#E4F1F2;
    --navy:#2E4756;
    --date-accent:#2E4756;
    --navy-tint:#E9EDEF;
    --gold:#D9A04B;
    --gold-tint:#FBF0DE;
    --sage:#4C8B6E;
    --sage-tint:#E4F0EA;
    --plum:#6B5CA5;
    --plum-tint:#ECE8F5;
    --terracotta:#C1584B;
    --terracotta-tint:#F8E7E4;
    --bg:#F5F7F6;
    --surface:#FFFFFF;
    --border:#E1E7E6;
    --text:#20303A;
    --text-muted:#657078;
    --radius-sm:8px;
    --radius-md:12px;
    --radius-lg:18px;
    --shadow-1: 0 1px 2px rgba(32,48,58,.06);
    --shadow-2: 0 8px 24px rgba(32,48,58,.10);
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:inherit;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100%;
  }
  h1,h2,h3,.font-display{font-family:'Space Grotesk',system-ui,sans-serif;}
  button{font-family:inherit;}
  a{color:inherit;}

  /* ---------- Sidebar shell (layout test) ---------- */
  .app-shell{ display:flex; min-height:100vh; }
  .sidebar{
    width:248px; flex:none; background:var(--navy); color:#fff;
    display:flex; flex-direction:column; padding:20px 14px 16px;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .sidebar-brand{
    display:flex; align-items:center; gap:10px;
    padding:2px 8px 18px; border-bottom:1px solid rgba(255,255,255,.14); margin-bottom:12px;
  }
  .sidebar-brand img{ height:26px; width:auto; }
  .sidebar-brand .title{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14.5px; }
  .sidebar-brand .subtitle{ font-size:11px; color:rgba(255,255,255,.62); }
  .sidebar-nav{ display:flex; flex-direction:column; gap:3px; }
  .sidebar-nav-item{
    display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px;
    color:rgba(255,255,255,.72); font-size:13.5px; font-weight:600; cursor:pointer;
    background:transparent; border:none; text-align:left; width:100%; font-family:inherit;
    transition:background .12s ease, color .12s ease;
  }
  .sidebar-nav-item:hover{ background:rgba(255,255,255,.07); color:#fff; }
  .sidebar-nav-item.active{ background:var(--teal); color:#fff; }
  .sidebar-nav-item .icon{ display:inline-flex; align-items:center; justify-content:center; font-size:15px; width:18px; text-align:center; flex:none; }

  .main-col{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .main-topbar{
    background:var(--surface); border-bottom:1px solid var(--border);
    padding:12px 22px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    position:sticky; top:0; z-index:20;
  }

  @media (max-width:860px){
    .app-shell{ flex-direction:column; }
    .sidebar{ width:100%; height:auto; position:static; flex-direction:row; align-items:center; padding:12px 14px; overflow-x:auto; }
    .sidebar-brand{ border-bottom:none; border-right:1px solid rgba(255,255,255,.14); margin-bottom:0; padding:0 14px 0 2px; flex:none; }
    .sidebar-nav{ flex-direction:row; padding-left:10px; }
    .sidebar-nav-item{ white-space:nowrap; }
  }

  /* ---------- Dashboard view ---------- */
  .dash-hero-row{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:18px; }
  .dash-hero-row.single{ grid-template-columns:1fr; }
  .dash-hero-card{
    position:relative; overflow:hidden; border-radius:var(--radius-lg);
    background:linear-gradient(135deg, var(--navy) 0%, var(--teal-dark) 100%);
    color:#fff; padding:22px 24px; min-height:150px;
  }
  .dash-hero-card::after{
    content:""; position:absolute; top:-40px; right:-30px; width:140px; height:140px;
    border-radius:50%; background:rgba(255,255,255,.06);
  }
  .dash-hero-label{ font-size:11.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--gold); position:relative; }
  .dash-hero-date{ font-family:'Space Grotesk',sans-serif; font-size:26px; font-weight:700; margin:4px 0 2px; position:relative; }
  .dash-hero-weekday{ font-size:13px; color:rgba(255,255,255,.75); margin-bottom:14px; position:relative; }
  .dash-hero-people{ display:flex; flex-wrap:wrap; gap:10px; position:relative; }
  .dash-hero-person{
    background:rgba(255,255,255,.12); border-radius:12px; padding:9px 13px; min-width:150px;
  }
  .dash-hero-person .p-name{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px; }
  .dash-hero-person .p-sub{ font-size:11.5px; color:rgba(255,255,255,.75); margin-top:2px; }
  .dash-hero-person{ min-width:260px; max-width:400px; flex:1 1 260px; }
  .dash-hero-person .p-sub{ font-size:12.5px; color:rgba(255,255,255,.82); margin-top:3px; }
  .dash-hero-person .p-client{ font-size:13.5px; font-weight:700; color:#fff; margin-top:4px; }
  .dash-hero-person .p-time{ font-weight:600; color:#fff; display:flex; align-items:center; gap:5px; }
  .dash-hero-person .p-addr{ display:flex; align-items:flex-start; gap:5px; line-height:1.3; font-size:12px; }
  .dash-hero-person .p-addr .ico{ margin-top:2px; }
  .dash-hero-empty{ font-size:13px; color:rgba(255,255,255,.7); position:relative; }

  .dash-stats-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .dash-stat-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:16px; display:flex; align-items:center; gap:12px; box-shadow:var(--shadow-1);
  }
  .dash-stat-icon{
    width:40px; height:40px; border-radius:10px; background:var(--teal-tint); color:var(--teal-dark);
    display:flex; align-items:center; justify-content:center; font-size:18px; flex:none;
  }
  .dash-stat-value{ font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:700; }
  .dash-stat-label{ font-size:11.5px; color:var(--text-muted); margin-top:1px; }

  @media (max-width:760px){
    .dash-hero-row{ grid-template-columns:1fr; }
    .dash-stats-row{ grid-template-columns:repeat(2,1fr); }
  }

  /* ---------- Page banner (mesmo degradê da página Início, usado nas demais abas) ---------- */
  .page-banner{
    background:linear-gradient(135deg, var(--navy) 0%, var(--teal-dark) 100%);
    color:#fff; border-radius:var(--radius-lg); padding:16px 22px;
    position:relative; overflow:hidden;
  }
  .page-banner::after{
    content:""; position:absolute; top:-40px; right:-30px; width:130px; height:130px;
    border-radius:50%; background:rgba(255,255,255,.07); pointer-events:none;
  }
  .page-banner .date-label{ color:#fff; position:relative; }
  .page-banner .legend{ color:rgba(255,255,255,.78); position:relative; }
  .page-banner .legend .dot{ box-shadow:0 0 0 1px rgba(255,255,255,.35); }
  .page-banner .date-nav{ position:relative; }
  .page-banner .nav-round{ background:rgba(255,255,255,.14); border-color:rgba(255,255,255,.25); color:#fff; }
  .page-banner .nav-round:hover{ background:rgba(255,255,255,.26); }
  .page-banner .btn-ghost{ background:rgba(255,255,255,.14); border-color:rgba(255,255,255,.3); color:#fff; }
  .page-banner .btn-ghost:hover{ background:rgba(255,255,255,.26); }

  /* ---------- Top bar ---------- */
  .topbar{
    background:var(--surface);
    border-bottom:1px solid var(--border);
    padding:14px 20px;
    display:flex;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
    position:sticky;
    top:env(safe-area-inset-top,0px);
    z-index:30;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    padding-right:16px;
    border-right:1px solid var(--border);
  }
  .brand img{height:28px;width:auto;display:block;}
  .view-tabs{
    display:flex;
    gap:4px;
    background:var(--bg);
    padding:4px;
    border-radius:999px;
    border:1px solid var(--border);
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
  }
  .view-tab{
    border:none;
    background:transparent;
    padding:7px 14px;
    border-radius:999px;
    font-size:13.5px;
    font-weight:600;
    color:var(--text-muted);
    cursor:pointer;
    white-space:nowrap;
    transition:background .15s ease, color .15s ease;
  }
  .view-tab:hover{color:var(--text);}
  .view-tab.active{
    background:var(--navy);
    color:#fff;
  }
  .topbar-right{
    display:flex;
    align-items:center;
    gap:8px;
    margin-left:auto;
    flex-wrap:wrap;
  }
  select, .btn, input, textarea{
    font-family:inherit;
    font-size:13.5px;
  }
  select.filter-select{
    border:1px solid var(--border);
    background:var(--surface);
    padding:8px 12px;
    border-radius:var(--radius-sm);
    color:var(--text);
    font-weight:500;
    cursor:pointer;
    max-width:180px;
  }
  .btn{
    border:none;
    padding:9px 16px;
    border-radius:var(--radius-sm);
    font-weight:600;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
    transition:transform .1s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn-primary{ background:var(--teal); color:#fff; }
  .btn-primary:hover{background:var(--teal-dark);}
  .btn-ghost{ background:transparent; color:var(--text); border:1px solid var(--border); }
  .btn-ghost:hover{background:var(--bg);}
  .btn-sm{padding:6px 11px;font-size:12.5px;}
  .btn:active{transform:scale(.97);}

  /* ---------- Layout ---------- */
  main{ max-width:1240px; margin:0 auto; padding:22px 20px 60px; }
  .panel-head{
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:12px; margin-bottom:16px;
  }
  .date-nav{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .date-nav button.nav-round{
    width:32px;height:32px; border-radius:50%;
    border:1px solid var(--border); background:var(--surface);
    cursor:pointer; display:flex;align-items:center;justify-content:center;
    color:var(--text); font-size:15px;
  }
  .date-nav button.nav-round:hover{background:var(--bg);}
  .date-label{
    font-size:18px; font-weight:600; font-family:'Space Grotesk',sans-serif;
    text-transform:capitalize; min-width:170px;
  }
  .legend{ display:flex; gap:14px; flex-wrap:wrap; font-size:12.5px; color:var(--text-muted); }
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;}

  /* ---------- Badges ---------- */
  .status-badge{
    display:inline-block; font-size:10.5px; font-weight:700;
    padding:2px 8px; border-radius:999px; text-transform:uppercase; letter-spacing:.02em;
    white-space:nowrap;
  }
  .status-disponivel{background:var(--sage-tint);color:#2E5F45;}
  .status-andamento{background:var(--gold-tint);color:#8A6318;}
  .status-finalizado{background:var(--teal-tint);color:var(--teal-dark);}
  .status-provisionado{background:var(--plum-tint);color:#4B3E80;}

  .coverage-tag{
    display:inline-flex; align-items:center; gap:4px;
    font-size:11px; font-weight:600; color:var(--text-muted);
    background:var(--bg); border:1px solid var(--border);
    padding:2px 8px; border-radius:999px; white-space:nowrap;
  }

  /* ---------- Assignment row (used in Daily + List) ---------- */
  .assignment-row{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-sm); padding:12px 14px; margin-bottom:9px;
    cursor:pointer; box-shadow:var(--shadow-1);
  }
  .assignment-row:hover{box-shadow:var(--shadow-2);}
  .ar-when{ display:flex; flex-direction:column; align-items:flex-start; gap:5px; min-width:120px; }
  .ar-period{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:13px;
    color:var(--date-accent);
  }
  .ar-period small{display:block;font-weight:500;color:var(--text-muted);font-size:10.5px;}
  .ar-main{flex:1;min-width:180px;}
  .ar-main .a-title{font-weight:700;font-size:13.5px;}
  .ar-main .a-meta{font-size:12px;color:var(--text-muted);margin-top:2px;}
  .addr-line{font-size:11px;color:var(--text-muted);margin-top:3px;line-height:1.3;}
  .addr-line .pin{opacity:.8;}
  .ico{ width:1em; height:1em; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; vertical-align:-.16em; flex:none; }
  .sidebar-nav-item .icon .ico{ width:17px; height:17px; vertical-align:middle; }
  .coverage-tag .ico{ margin-right:2px; }
  .a-hours{ display:flex; align-items:center; gap:5px; font-size:12.5px; font-weight:600; color:var(--text); margin-top:1px; white-space:nowrap; }
  .week-chip .a-hours{ font-size:11.5px; font-weight:600; color:var(--text-muted); margin-top:2px; }
  .tv-hr{ display:block; font-size:16px; font-weight:500; color:#8B9A9E; margin-top:2px; text-transform:none; }
  .dash-stat-icon{ color:#58B9C6; }
  .tech-chip{
    display:inline-flex; align-items:center; gap:6px;
    font-family:'Space Grotesk',sans-serif; font-size:14.5px; font-weight:700; color:#fff;
    padding:5px 13px; border-radius:999px; white-space:nowrap; letter-spacing:.01em;
  }
  .ar-tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}

  /* ---------- Weekly view ---------- */
  .week-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:10px; }
  .week-day{
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-md); min-height:180px; padding:10px;
    box-shadow:var(--shadow-1);
  }
  .week-day.is-today{border-color:var(--teal); box-shadow:0 0 0 2px var(--teal-tint) inset;}
  .week-day-head{
    font-size:12px; color:var(--text-muted); font-weight:700;
    text-transform:uppercase; letter-spacing:.03em; margin-bottom:2px;
  }
  .week-day-num{ font-family:'Space Grotesk',sans-serif; font-size:19px; font-weight:700; margin-bottom:8px; }
  .week-chip{
    border-radius:6px; padding:6px 8px; font-size:11px; margin-bottom:6px; cursor:pointer;
    border-left:3px solid var(--teal); background:var(--bg);
  }
  .week-chip .a-title{font-family:'Space Grotesk',sans-serif;font-weight:700;display:block;font-size:13.5px;}
  .week-chip .a-tech{color:var(--text-muted);font-size:12px;}
  .week-chip .addr-line{filter:brightness(0.82);}

  /* ---------- Monthly view ---------- */
  .month-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
  .month-weekday-head{
    font-size:11.5px; font-weight:700; color:var(--text-muted);
    text-transform:uppercase; letter-spacing:.03em; text-align:center; padding-bottom:4px;
  }
  .month-cell{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm);
    min-height:100px; padding:8px; cursor:pointer; transition:background .12s ease;
  }
  .month-cell:hover{background:var(--teal-tint);}
  .month-cell.other-month{opacity:.42;}
  .month-cell.is-today{border-color:var(--teal);border-width:2px;}
  .month-cell-num{font-weight:700;font-size:13px;margin-bottom:6px;font-family:'Space Grotesk',sans-serif;}
  .month-dots{display:flex;flex-wrap:wrap;gap:4px;}
  .month-dots .dot{width:7px;height:7px;}
  .month-more{font-size:10.5px;color:var(--text-muted);margin-top:3px;}

  /* ---------- List view ---------- */
  .list-group{margin-bottom:20px;}
  .list-month-head{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14.5px;
    text-transform:capitalize; color:var(--date-accent); margin-bottom:8px;
    padding-bottom:6px; border-bottom:2px solid var(--border);
  }

/* ---------- Empty state ---------- */
  .empty-state{ text-align:center; padding:60px 20px; color:var(--text-muted); }
  .empty-state .icon{font-size:34px;margin-bottom:10px;}

  /* ---------- Coverage view ---------- */
  .coverage-wrap{ display:flex; flex-direction:column; gap:14px; }
  .coverage-tech-card + .coverage-wrap{ margin-top:14px; }
  .coverage-tech-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:16px; box-shadow:var(--shadow-1);
  }
  .coverage-tech-head{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;
    margin-bottom:12px;
  }
  .coverage-ratio{ font-size:12.5px; color:var(--text-muted); font-weight:600; }
  .coverage-section-title{ font-size:12px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.03em; margin:10px 0 6px; }
  .coverage-chip-row{ display:flex; flex-wrap:wrap; gap:7px; }
  .coverage-chip{
    display:inline-flex; flex-direction:column; align-items:flex-start; gap:1px;
    padding:5px 10px; border-radius:10px; font-size:12px; font-weight:600;
    border:1px solid var(--border); background:var(--bg); color:var(--text);
  }
  .coverage-chip small{ font-weight:500; font-size:10px; color:var(--text-muted); }
  .coverage-chip.visited{ background:var(--sage-tint); color:#2E5F45; border-color:transparent; }
  .coverage-chip.visited small{ color:#2E5F45; opacity:.75; }
  .coverage-chip.scheduled{ background:var(--plum-tint); color:#4B3E80; border-color:transparent; }
  .coverage-chip.scheduled small{ color:#4B3E80; opacity:.8; }
  .coverage-chip.pending{ background:transparent; color:var(--text-muted); border-style:dashed; }
  .coverage-empty{ font-size:12.5px; color:var(--text-muted); font-style:italic; }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed;inset:0; background:rgba(32,48,58,.45);
    display:none; align-items:flex-start; justify-content:center;
    padding:40px 16px; overflow-y:auto; z-index:100;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--surface); border-radius:var(--radius-lg); width:100%; max-width:500px;
    padding:22px 22px 20px; box-shadow:var(--shadow-2);
  }
  .modal h3{margin:0 0 16px;font-size:18px;}
  .field{margin-bottom:13px;}
  .field label{ display:block; font-size:12.5px; font-weight:600; color:var(--text-muted); margin-bottom:5px; }
  .field input, .field select, .field textarea{
    width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:var(--radius-sm);
    background:var(--bg); color:var(--text);
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:2px solid var(--teal); outline-offset:1px; background:var(--surface);
  }
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  #detailBody .field > div{font-size:14px;color:var(--text);line-height:1.4;}
  .modal-actions{ display:flex; justify-content:space-between; align-items:center; margin-top:18px; gap:10px; }
  .modal-actions .right{display:flex;gap:8px;}
  textarea{resize:vertical;min-height:56px;}

  .banner{ background:var(--navy); color:#fff; font-size:12.5px; padding:9px 20px; text-align:center; }
  .banner b{color:var(--gold);}

  @media (max-width:760px){
    .week-grid{grid-template-columns:repeat(7,minmax(120px,1fr));overflow-x:auto;}
    .month-grid{grid-template-columns:repeat(7,minmax(64px,1fr));overflow-x:auto;}
    .topbar{gap:10px;}
    .date-label{font-size:16px;min-width:auto;}
    .field-row{grid-template-columns:1fr;}
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F1517; --surface:#182024; --border:#283134; --text:#EAF0EF; --text-muted:#8B9A9E;
      --teal-tint:#0F3339; --gold-tint:#332714; --sage-tint:#173023; --plum-tint:#251F38; --terracotta-tint:#331715;
      --date-accent:#D3DBDE;
    }
    :root:not([data-theme="light"]) .week-chip{background:#1D2629;}
  }
  :root[data-theme="dark"]{
    --bg:#0F1517; --surface:#182024; --border:#283134; --text:#EAF0EF; --text-muted:#8B9A9E;
    --teal-tint:#0F3339; --gold-tint:#332714; --sage-tint:#173023; --plum-tint:#251F38; --terracotta-tint:#331715;
    --date-accent:#D3DBDE;
  }
  :root[data-theme="dark"] .week-chip{background:#1D2629;}

  /* ---------- Resumo TV (16:9) — paleta fiel ao painel de manutenção (tema escuro) ---------- */
  .tv-note{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:0 0 12px; font-size:12.5px; color:var(--text-muted); }
  .tv-viewport{ position:relative; width:100%; height:70vh; padding-top:0; background:#0F1517; overflow:hidden; border-radius:14px; }
  .tv-stage{
    position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0;
    background:#0F1517; color:#EAF0EF; font-family:'Inter',system-ui,sans-serif;
    padding:34px 44px 30px; display:grid; grid-template-rows:92px 190px 96px 1fr 92px; row-gap:20px;
  }
  body.resumo-fit .app-shell{ min-height:calc(100vh - var(--banner-h,0px)); }
  @media (min-width:861px){ body.resumo-fit .sidebar{ height:calc(100vh - var(--banner-h,0px)); } }
  body.tv-mode{ background:#0F1517; overflow:hidden; }
  body.tv-mode .banner, body.tv-mode .sidebar, body.tv-mode .main-topbar, body.tv-mode .tv-note{ display:none !important; }
  body.tv-mode .app-shell{ display:block; min-height:0; }
  body.tv-mode .tv-viewport{ position:fixed; left:0; top:0; width:100vw; height:100vh; padding-top:0; border-radius:0; z-index:100; }
  .tv-stage *{ box-sizing:border-box; }
  .tv-head{ display:flex; align-items:center; gap:26px; }
  .tv-logo{ height:70px; width:auto; }
  .tv-sep{ width:2px; height:62px; background:#283134; }
  .tv-title{ font:700 46px/1.05 'Space Grotesk',system-ui,sans-serif; letter-spacing:-.01em; color:#EAF0EF; }
  .tv-sub{ font-size:21px; color:#818F93; margin-top:6px; }
  .tv-clockwrap{ margin-left:auto; text-align:right; }
  .tv-clock{ font:700 76px/1 'Space Grotesk',system-ui,sans-serif; color:#EAF0EF; font-variant-numeric:tabular-nums; }
  .tv-date{ font-size:25px; color:#8B9A9E; margin-top:4px; }

  .tv-kpis{ display:grid; grid-template-columns:1.55fr 1fr 1fr 1fr 1fr; gap:22px; }
  .tv-kpi{ background:#182024; border:1px solid #232B2E; border-radius:22px; padding:20px 22px; display:flex; align-items:center; gap:18px; position:relative; overflow:hidden; min-width:0; }
  .tv-kpi.hero{ background:linear-gradient(135deg,#2D4756 0%,#135966 100%); border-color:transparent; flex-direction:column; align-items:flex-start; justify-content:center; gap:6px; }
  .tv-kpi.hero::after{ content:""; position:absolute; top:-70px; right:-50px; width:230px; height:230px; border-radius:50%; background:rgba(255,255,255,.055); }
  .tv-kpi.hero .tv-big{ font-size:96px; color:#fff; }
  .tv-kpi.hero .tv-lab{ color:#DCE8EA; font-size:25px; line-height:1.22; position:relative; }
  .tv-kpi.hero b{ color:#D9A04B; font-weight:700; }
  .tv-kpi.red{ background:#331715; border-color:#3F1D1A; }
  .tv-ico{ width:72px; height:72px; border-radius:20px; display:flex; align-items:center; justify-content:center; font-size:36px; flex:none; }
  .tv-body{ display:flex; flex-direction:column; min-width:0; }
  .tv-big{ font:700 84px/.95 'Space Grotesk',system-ui,sans-serif; color:#EAF0EF; letter-spacing:-.02em; }
  .tv-lab{ font-size:22px; line-height:1.18; color:#8B9A9E; margin-top:8px; }
  .tv-kpi.red .tv-big{ color:#C1584B; }

  .tv-stages{ display:grid; grid-template-columns:repeat(5,1fr); gap:20px; }
  .tv-stage-card{ background:#182024; border:1px solid #232B2E; border-top:5px solid; border-radius:18px; padding:0 24px; display:flex; align-items:center; gap:18px; min-width:0; }
  .tv-stage-card .n{ font:700 58px/1 'Space Grotesk',system-ui,sans-serif; color:#EAF0EF; }
  .tv-stage-card .l{ font-size:22px; line-height:1.15; color:#EAF0EF; }
  .tv-stage-card.zero{ background:#131A1D; }
  .tv-stage-card.zero .n{ color:#7C8283; }
  .tv-stage-card.zero .l{ color:#5B6568; }

  .tv-main{ display:grid; grid-template-columns:1.55fr 1fr; gap:22px; min-height:0; }
  .tv-col{ display:flex; flex-direction:column; gap:20px; min-height:0; }
  .tv-panel{ background:#182024; border:1px solid #1C2428; border-radius:22px; padding:22px 28px; display:flex; flex-direction:column; min-height:0; overflow:hidden; flex:1 1 0; }
  .tv-ph{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .tv-pt{ font:700 30px/1.1 'Space Grotesk',system-ui,sans-serif; color:#EAF0EF; }
  .tv-count{ min-width:46px; height:34px; padding:0 14px; border-radius:999px; font:700 20px/34px 'Space Grotesk',system-ui,sans-serif; text-align:center; }
  .tv-rows{ display:flex; flex-direction:column; }
  .tv-row{ display:flex; align-items:center; gap:18px; padding:9px 0; border-bottom:1px solid #1E262A; min-height:58px; }
  .tv-row:last-child{ border-bottom:none; }
  .tv-pill{ width:200px; flex:none; text-align:center; color:#fff; font-weight:700; font-size:19px; padding:8px 0; border-radius:999px; }
  .tv-who{ flex:1 1 0; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tv-nm{ font:700 27px 'Space Grotesk',system-ui,sans-serif; color:#EAF0EF; letter-spacing:.005em; }
  .tv-nm2{ font-size:19px; color:#829094; font-weight:500; }
  .tv-cli{ width:250px; flex:none; font-size:22px; color:#8B9A9E; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tv-until{ width:104px; flex:none; text-align:right; font-size:19px; color:#6C7A7D; }
  .tv-days{ width:84px; flex:none; text-align:right; font:700 30px 'Space Grotesk',system-ui,sans-serif; color:#EAF0EF; }
  .tv-empty{ flex:1; display:flex; align-items:center; justify-content:center; text-align:center; font-size:26px; color:#8B9A9E; padding:0 20px; }
  .tv-more{ font-size:20px; color:#8B9A9E; margin-top:8px; }
  .tv-row.sm{ min-height:50px; padding:7px 0; gap:16px; }
  .tv-row.sm .tv-nm{ font-size:24px; } .tv-row.sm .tv-nm2{ font-size:18px; }
  .tv-row.sm .tv-cli{ width:230px; font-size:19px; }
  .tv-row.sm .tv-days{ width:92px; font-size:26px; }
  .tv-ov{ display:flex; flex-direction:column; gap:3px; padding:7px 0; border-bottom:1px solid #1E262A; }
  .tv-ov:last-child{ border-bottom:none; }
  .tv-ov .top{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .tv-ov .rng{ font:700 26px 'Space Grotesk',system-ui,sans-serif; color:#C1584B; }
  .tv-ov .sub{ font-size:18px; color:#8B9A9E; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .tv-foot{ background:#182024; border:1px solid #1C2428; border-radius:22px; padding:0 30px; display:flex; align-items:center; gap:34px; }
  .tv-foot .ft{ font:700 28px/1.12 'Space Grotesk',system-ui,sans-serif; color:#EAF0EF; width:230px; flex:none; }
  .tv-stat{ display:flex; align-items:baseline; gap:10px; flex:none; }
  .tv-stat .n{ font:700 56px/1 'Space Grotesk',system-ui,sans-serif; color:#EAF0EF; }
  .tv-stat .u{ font-size:22px; color:#8B9A9E; }
  .tv-bar{ flex:1; height:16px; border-radius:8px; background:#283134; display:flex; overflow:hidden; min-width:120px; }
  .tv-bar i{ display:block; height:100%; }

  /* ---------- Menu lateral recolhível ---------- */
  body.sidebar-hidden .sidebar{ display:none; }
  body.sidebar-hidden .main-topbar{ padding-left:58px; }
  body.resumo-fit .main-topbar{ display:none; }
  #sidebarToggle{
    position:fixed; left:8px; top:calc(var(--banner-h,0px) + 12px); z-index:60;
    width:36px; height:36px; border-radius:10px; border:1px solid rgba(255,255,255,.18);
    background:var(--navy); color:#fff; font-size:18px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,.25);
  }
  #sidebarToggle:hover{ background:var(--teal); }
  body.resumo-fit #sidebarToggle{ top:calc(var(--banner-h,0px) + 5px); width:32px; height:32px; font-size:16px; opacity:.85; }
  body:not(.sidebar-hidden) #sidebarToggle{ display:none; }
  body.tv-mode #sidebarToggle{ display:none !important; }
  .sidebar-hide-btn{ margin-top:10px; border-top:1px solid rgba(255,255,255,.14); border-radius:0 0 10px 10px; padding-top:14px; }
</style>
</head>

        (addr ? '<div class="addr-line"><span class="pin">'+ic('pin')+'</span> '+escapeHtml(addr)+'</div>' : '') +
      '</div>' +
      '<div class="ar-tags">' +
        '<span class="coverage-tag">'+COVERAGE_ICON[a.coverage]+' '+COVERAGE_LABELS[a.coverage]+'</span>' +
        '<span class="status-badge status-'+a.status+'">'+STATUS_LABELS[a.status]+'</span>' +
      '</div>' +
    '</div>';
  }

  /* ============ Vista Início / Dashboard ============ */
  function heroCardHtml(label, dateStr){
    var acts = assignmentsForDate(dateStr);
    if(acts.length === 0) return null; // nada agendado nesta data: não exibir o card
    var d = new Date(dateStr+"T00:00:00");
    var weekday = WEEKDAY_NAMES[d.getDay()];
    var peopleHtml = acts.map(function(a){
      var tech = techById(a.techId);
      return '<div class="dash-hero-person" style="background:'+tech.color+'22;">' +
        '<div class="p-name" style="color:#fff;">'+escapeHtml(tech.name)+'</div>' +
        '<div class="p-sub p-client">'+escapeHtml(clientLabel(a))+'</div>' +
        '<div class="p-sub">Responsável: '+escapeHtml(a.responsible||"—")+'</div>' +
        (a.horario ? '<div class="p-sub p-time">'+ic('clock')+' '+escapeHtml(a.horario)+'</div>' : '') +
        (getAddress(a) ? '<div class="p-sub p-addr">'+ic('pin')+' <span>'+escapeHtml(getAddress(a))+'</span></div>' : '') +
      '</div>';
    }).join("");
    return '<div class="dash-hero-card" style="background:linear-gradient(135deg, var(--navy) 0%, var(--teal-dark) 100%);">' +
      '<div class="dash-hero-label">'+label+'</div>' +
      '<div class="dash-hero-date">'+fmtDD_MM(dateStr)+'</div>' +
      '<div class="dash-hero-weekday">'+weekday+(isWeekend(dateStr)? ' · fim de semana':'')+'</div>' +
      '<div class="dash-hero-people">'+peopleHtml+'</div>' +
    '</div>';
  }

  function renderDashboard(container){
    var head = document.createElement("div");
    head.className = "panel-head";
    head.innerHTML = '<div class="date-label" style="font-size:16px;">Painel da Agenda</div>' +
      '<div class="legend"><span>Visão geral de hoje, amanhã e indicadores gerais</span></div>';
    container.appendChild(head);

    var cards = [heroCardHtml("Hoje", T), heroCardHtml("Amanhã", addDaysToStr(T,1))].filter(Boolean);
    if(cards.length){
      var heroRow = document.createElement("div");
      heroRow.className = "dash-hero-row" + (cards.length===1 ? " single":"");
      heroRow.innerHTML = cards.join("");
      container.appendChild(heroRow);
    } else {
      var noneCard = document.createElement("div");
      noneCard.className = "empty-state";
      noneCard.innerHTML = '<div class="icon">'+ic('inbox')+'</div>Nada agendado para hoje ou amanhã.';
      container.appendChild(noneCard);
    }

    // Próxima atividade (primeira futura ou de hoje em diante, ordenada por início)
    var upcoming = state.assignments.slice()
      .filter(function(a){ return a.end >= T; })
      .sort(function(a,b){ return a.start.localeCompare(b.start); })[0];

    // Atividades com início neste mês
    var curMonth = T.slice(0,7);
    var thisMonthCount = state.assignments.filter(function(a){ return a.start.slice(0,7) === curMonth; }).length;

    // Clientes já cobertos (ao menos um período finalizado ou em andamento)
    var coveredClients = {};
    state.assignments.forEach(function(a){
      if(a.status === "finalizado" || a.status === "andamento") coveredClients[a.client] = true;
    });

    var stats = [
      {icon:ic("skip-forward"), value: upcoming ? fmtDD_MM(upcoming.start)+' · '+clientLabel(upcoming) : "—", label:"Próxima atividade"},
      {icon:ic("users"), value: state.technicians.length, label:"Técnicos ativos"},
      {icon:ic("trending"), value: thisMonthCount, label:"Atividades neste mês"},
      {icon:ic("building"), value: Object.keys(coveredClients).length+' de '+CLIENTS.length, label:"Clientes já cobertos"}
    ];

    var statsRow = document.createElement("div");
    statsRow.className = "dash-stats-row";
    statsRow.innerHTML = stats.map(function(s){
      return '<div class="dash-stat-card">' +
        '<div class="dash-stat-icon">'+s.icon+'</div>' +
        '<div><div class="dash-stat-value">'+s.value+'</div><div class="dash-stat-label">'+s.label+'</div></div>' +
      '</div>';
    }).join("");
    container.appendChild(statsRow);
  }

  var TV_MODE = false;

  function tvNameHtml(full){
    var n = String(full).replace(/\s*\(inativo\)\s*/,"").trim();
    var i = n.indexOf(" ");
    var first = i<0 ? n : n.slice(0,i), rest = i<0 ? "" : n.slice(i+1);
    return '<span class="tv-nm">'+escapeHtml(first.toUpperCase())+'</span>' +
      (rest ? ' <span class="tv-nm2">'+escapeHtml(rest.toUpperCase())+'</span>' : '');
  }
  function tvNextWeekday(str){ while(isWeekend(str)) str = addDaysToStr(str,1); return str; }
  function tvDiffDays(a,b){ return Math.round((new Date(b+"T00:00:00") - new Date(a+"T00:00:00"))/86400000); }
  function tvClockStrings(){
    var d = new Date();
    return {time: pad(d.getHours())+":"+pad(d.getMinutes()),
            date: TV_WEEKDAYS[d.getDay()]+", "+d.getDate()+" De "+TV_MONTHS[d.getMonth()]};
  }
  function tvCount(n, kind){
    var st = {teal:"background:#0F3339;color:#1C7A88;", green:"background:#234635;color:#4C8B6E;", red:"background:#331715;color:#C1584B;", plum:"background:#251F38;color:#8E7FD0;"}[kind];
    return '<span class="tv-count" style="'+st+'">'+n+'</span>';
  }

  function renderSummary(container){
    var D = tvNextWeekday(T);
    var dayTxt = (D===T) ? "hoje" : "em "+fmtDD_MM(D);
    var active = state.technicians.filter(function(t){ return !t.inactive; });
    var activeIds = {}; active.forEach(function(t){ activeIds[t.id] = true; });
    // Status efetivo (só para exibição): "Em andamento" cujo fim já passou conta como finalizado.
    function eff(a){ return (a.status==="andamento" && a.end < T) ? "finalizado" : a.status; }
    var open = state.assignments.filter(function(a){ return eff(a) !== "finalizado"; });
    var onD = open.filter(function(a){ return a.start <= D && D <= a.end && activeIds[a.techId]; })
      .sort(function(a,b){ return techById(a.techId).name.localeCompare(techById(b.techId).name); });

    var fieldIds = {}, clientsToday = {};
    onD.forEach(function(a){ fieldIds[a.techId] = true; clientsToday[a.client] = true; });
    var inField = Object.keys(fieldIds).length;
    var freeCount = active.filter(function(t){ return !fieldIds[t.id]; }).length;

    var andamentoN = state.assignments.filter(function(a){ return eff(a)==="andamento"; }).length;
    var provN = state.assignments.filter(function(a){ return eff(a)==="provisionado"; }).length;
    var doneN = state.assignments.filter(function(a){ return eff(a)==="finalizado"; }).length;
    var totalN = state.assignments.length;

    var visitedAny = {};
    state.assignments.forEach(function(x){ if(x.status==="finalizado" || x.status==="andamento") visitedAny[x.client] = true; });
    var unvisited = CLIENTS.filter(function(c){ return !visitedAny[c]; }).length;

    var covCount = {}; TV_COV_ORDER.forEach(function(k){ covCount[k] = 0; });
    onD.forEach(function(a){ if(covCount[a.coverage] !== undefined) covCount[a.coverage]++; });

    // Em campo
    var MAXROWS = 6;
    var rowsHtml = onD.slice(0, MAXROWS).map(function(a){
      var left = tvDiffDays(D, a.end) + 1;
      var col = left<=1 ? "#C1584B" : (left<=3 ? "#D9A04B" : "#EAF0EF");
      return '<div class="tv-row">' +
        '<div class="tv-pill" style="background:'+(TV_COV_COLOR[a.coverage]||"#1C7A88")+'">'+escapeHtml(COVERAGE_LABELS[a.coverage]||a.coverage)+'</div>' +
        '<div class="tv-who">'+tvNameHtml(techById(a.techId).name)+'</div>' +
        '<div class="tv-cli">'+escapeHtml(clientLabel(a))+(a.horario ? '<span class="tv-hr">'+ic('clock')+' '+escapeHtml(a.horario)+'</span>' : '')+'</div>' +
        '<div class="tv-until">até '+fmtDD_MM(a.end)+'</div>' +
        '<div class="tv-days" style="color:'+col+'">'+left+'d</div>' +
      '</div>';
    }).join("");

  function fitTvStage(){
    var vp = document.getElementById("tvViewport"), st = document.getElementById("tvStage");
    if(!vp || !st) return;
    var bn = document.getElementById("protoBanner");
    document.documentElement.style.setProperty("--banner-h", (bn ? bn.offsetHeight : 0)+"px");
    if(!TV_MODE){
      var offTop = vp.getBoundingClientRect().top + (window.pageYOffset||0);
      vp.style.height = Math.max(260, window.innerHeight - offTop - 10) + "px";
    }
    var s = Math.min(vp.clientWidth/1920, vp.clientHeight/1080);
    if(!(s > 0)) return;
    st.style.transform = "scale("+s+")";
    st.style.left = ((vp.clientWidth - 1920*s)/2)+"px";
    st.style.top = ((vp.clientHeight - 1080*s)/2)+"px";
  }
  window.addEventListener("resize", fitTvStage);

  var TV_STARTED = Date.now();
  setInterval(function(){
    var c = document.getElementById("tvClock");
    if(c){ var k = tvClockStrings(); c.textContent = k.time; document.getElementById("tvDate").textContent = k.date; }
    if(TV_MODE){
      // Painel de TV: ao virar o dia, ou a cada 30 min, recarrega para pegar a agenda publicada mais recente.
      if(todayStr() !== T || Date.now() - TV_STARTED > 30*60*1000){ window.location.reload(); }
    }
  }, 1000);

  /* ============ Vista Semanal ============ */
  function startOfWeek(dateStr){
    var d = new Date(dateStr+"T00:00:00");
    var day = d.getDay();
    var diff = (day===0? -6 : 1) - day;
    d.setDate(d.getDate()+diff);
    return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  }

  function renderWeekly(container){
    var start = startOfWeek(state.currentDate);
    var endOfWeek = addDaysToStr(start,6);
    var head = document.createElement("div");
    head.className = "panel-head page-banner";
    head.innerHTML =
      '<div class="date-nav">' +
        '<button class="nav-round" id="prevWeek" aria-label="Semana anterior">‹</button>' +
        '<div class="date-label">'+fmtDD_MM(start)+' – '+fmtDateLong(endOfWeek)+'</div>' +
        '<button class="nav-round" id="nextWeek" aria-label="Próxima semana">›</button>' +
        '<button class="btn btn-ghost btn-sm" id="todayBtn">Hoje</button>' +
      '</div>';
    container.appendChild(head);

    var grid = document.createElement("div");
    grid.className = "week-grid";
    for(var i=0;i<7;i++){
      var dateStr = addDaysToStr(start,i);
      var d = new Date(dateStr+"T00:00:00");
      var acts = assignmentsForDate(dateStr);
      var col = document.createElement("div");
      col.className = "week-day" + (dateStr===T ? " is-today":"");
      col.innerHTML =
        '<div class="week-day-head">'+WEEKDAY_NAMES[d.getDay()]+'</div>' +
        '<div class="week-day-num">'+d.getDate()+'</div>' +
        acts.map(function(a){
          var tech = techById(a.techId);
          var addr = getAddress(a);
          return '<div class="week-chip" style="border-left-color:'+STATUS_COLOR[a.status]+'" data-id="'+a.id+'">' +
            '<span class="a-title">'+escapeHtml(tech.name)+'</span>' +
            '<span class="a-tech">'+COVERAGE_ICON[a.coverage]+' '+escapeHtml(clientLabel(a))+'</span>' +
            hrHtml(a) +
            (addr ? '<div class="addr-line"><span class="pin">'+ic('pin')+'</span> '+escapeHtml(addr)+'</div>' : '') +
          '</div>';
        }).join("");
      grid.appendChild(col);
    }
    container.appendChild(grid);
    attachRowHandlers(container);
    document.getElementById("prevWeek").onclick = function(){ state.currentDate = addDaysToStr(state.currentDate,-7); renderAll(); };
    document.getElementById("nextWeek").onclick = function(){ state.currentDate = addDaysToStr(state.currentDate,7); renderAll(); };
    document.getElementById("todayBtn").onclick = function(){ state.currentDate = T; renderAll(); };
  }

  /* ============ Vista Mensal ============ */
  function renderMonthly(container){
    var d = new Date(state.currentDate+"T00:00:00");
    var year = d.getFullYear(), month = d.getMonth();

    var head = document.createElement("div");
    head.className = "panel-head page-banner";
    head.innerHTML =
      '<div class="date-nav">' +
        '<button class="nav-round" id="prevMonth" aria-label="Mês anterior">‹</button>' +
        '<div class="date-label">'+MONTH_NAMES[month]+' de '+year+'</div>' +
        '<button class="nav-round" id="nextMonth" aria-label="Próximo mês">›</button>' +
        '<button class="btn btn-ghost btn-sm" id="todayBtn">Hoje</button>' +
      '</div>';
    container.appendChild(head);

    var grid = document.createElement("div");
    grid.className = "month-grid";
    WEEKDAY_NAMES.forEach(function(w){
      var el = document.createElement("div");
      el.className = "month-weekday-head";
      el.textContent = w;
      grid.appendChild(el);
    });

    var firstOfMonth = new Date(year, month, 1);
    var startOffset = firstOfMonth.getDay();
    var gridStart = new Date(year, month, 1 - startOffset);

    for(var i=0;i<42;i++){
      var cellDate = new Date(gridStart);
      cellDate.setDate(gridStart.getDate()+i);
      var cellStr = cellDate.getFullYear()+"-"+pad(cellDate.getMonth()+1)+"-"+pad(cellDate.getDate());
      var acts = assignmentsForDate(cellStr);
      var cell = document.createElement("div");
      cell.className = "month-cell" +
        (cellDate.getMonth()!==month ? " other-month":"") +
        (cellStr===T ? " is-today":"");
      var dotsHtml = acts.slice(0,8).map(function(a){
        return '<span class="dot" style="background:'+STATUS_COLOR[a.status]+'" title="'+escapeHtml(techById(a.techId).name)+'"></span>';
      }).join("");
      cell.innerHTML =
        '<div class="month-cell-num">'+cellDate.getDate()+'</div>' +
        '<div class="month-dots">'+dotsHtml+'</div>' +
        (acts.length ? '<div class="month-more">'+acts.length+' técnico'+(acts.length>1?'s':'')+'</div>' : '');
      (function(str){
        cell.onclick = function(){ state.currentDate = str; state.view = "daily"; renderAll(); };
      })(cellStr);
      grid.appendChild(cell);
    }
    container.appendChild(grid);
    document.getElementById("prevMonth").onclick = function(){
      var nd = new Date(year, month-1, 1);
      state.currentDate = nd.getFullYear()+"-"+pad(nd.getMonth()+1)+"-01";
      renderAll();
    };
    document.getElementById("nextMonth").onclick = function(){
      var nd = new Date(year, month+1, 1);
      state.currentDate = nd.getFullYear()+"-"+pad(nd.getMonth()+1)+"-01";
      renderAll();
    };
    document.getElementById("todayBtn").onclick = function(){ state.currentDate = T; renderAll(); };
  }

  /* ============ Vista Lista ============ */
  function renderList(container){
    var head = document.createElement("div");
    head.className = "panel-head page-banner";

      empty.className = "empty-state";
      empty.innerHTML = '<div class="icon">'+ic('inbox')+'</div>Nenhum período encontrado.';
      container.appendChild(empty);
      return;
    }

    var byMonth = {}; var order = [];
    acts.forEach(function(a){
      var d = new Date(a.start+"T00:00:00");
      var key = d.getFullYear()+"-"+pad(d.getMonth()+1);
      if(!byMonth[key]){ byMonth[key]=[]; order.push(key); }
      byMonth[key].push(a);
    });

    order.forEach(function(key){
      var parts = key.split("-");
      var label = MONTH_NAMES[parseInt(parts[1],10)-1] + " de " + parts[0];
      var group = document.createElement("div");
      group.className = "list-group";
      group.innerHTML = '<div class="list-month-head">'+label+'</div>' + byMonth[key].map(assignmentRowHtml).join("");
      container.appendChild(group);
    });

  }

  /* ============ Vista Cobertura ============ */
  function renderCoverage(container){
    var head = document.createElement("div");
    head.className = "panel-head page-banner";
    head.innerHTML = '<div class="date-label" style="font-size:16px;">Cobertura por técnico</div>' +
      '<div class="legend"><span>Com base no histórico completo, sem filtro de status</span></div>';
    container.appendChild(head);

    // Clientes que ainda não tiveram visita de nenhum técnico (considera todo o histórico, inclusive técnicos inativos)
    var visitedAny = {}, scheduledFirst = {};
    state.assignments.forEach(function(x){
      if(x.status === "finalizado" || x.status === "andamento"){ visitedAny[x.client] = true; }
      else if(x.status === "provisionado"){
        if(!scheduledFirst[x.client] || x.start < scheduledFirst[x.client]) scheduledFirst[x.client] = x.start;
      }
    });
    var shownClients = CLIENTS.filter(function(c){ return state.clientFilter === "all" || state.clientFilter === c; });
    var unvisited = shownClients.filter(function(c){ return !visitedAny[c]; });
    var unvCard = document.createElement("div");
    unvCard.className = "coverage-tech-card";
    unvCard.style.borderColor = "var(--gold)";
    unvCard.innerHTML =
      '<div class="coverage-tech-head">' +
        '<span style="font-family:\'Space Grotesk\',sans-serif;font-weight:700;font-size:16px;">Clientes sem cobertura</span>' +
        '<span class="coverage-ratio">'+unvisited.length+' de '+shownClients.length+' clientes</span>' +
      '</div>' +
      '<div class="coverage-chip-row">' +
        (unvisited.length ? unvisited.map(function(c){
          return scheduledFirst[c]
            ? '<span class="coverage-chip scheduled">'+escapeHtml(c)+'<small>'+ic('clock')+' agendado para '+fmtDD_MM(scheduledFirst[c])+'</small></span>'
            : '<span class="coverage-chip pending">'+escapeHtml(c)+'<small>sem cobertura</small></span>';
        }).join("") : '<span class="coverage-empty">Todos os clientes já foram visitados</span>') +
      '</div>';
    container.appendChild(unvCard);

    // Usa todos os registros (independente do filtro de status ativo), só respeita técnico/tipo se selecionados
    var acts = state.assignments.slice();
    if(state.techFilter !== "all"){ acts = acts.filter(function(a){ return a.techId === state.techFilter; }); }
    if(state.coverageFilter !== "all"){ acts = acts.filter(function(a){ return a.coverage === state.coverageFilter; }); }

    var byTech = {};
    state.technicians.forEach(function(t){ byTech[t.id] = {}; });
    acts.forEach(function(a){
      var bucket = byTech[a.techId];
      if(!bucket) return;
      if(!bucket[a.client]) bucket[a.client] = {been:false, scheduled:false, count:0, lastEnd:null};
      var entry = bucket[a.client];
      entry.count++;
      if(a.status === "finalizado" || a.status === "andamento") entry.been = true;
      if(a.status === "provisionado") entry.scheduled = true;
      if(!entry.lastEnd || a.end > entry.lastEnd) entry.lastEnd = a.end;
    });

    var wrap = document.createElement("div");
    wrap.className = "coverage-wrap";

    state.technicians.forEach(function(t){
      if(t.inactive) return; // técnico inativo fora do planejamento de cobertura
      if(state.techFilter !== "all" && state.techFilter !== t.id) return;
      var bucket = byTech[t.id] || {};
      var visited = [], pending = [];
      shownClients.forEach(function(client){
        var entry = bucket[client];
        if(entry && entry.been){
          visited.push('<span class="coverage-chip visited">'+escapeHtml(client)+
            '<small>'+entry.count+'x · até '+fmtDD_MM(entry.lastEnd)+'</small></span>');
        } else if(entry && entry.scheduled){
          pending.push('<span class="coverage-chip scheduled">'+escapeHtml(client)+'<small>'+ic('clock')+' agendado</small></span>');
        } else {
          pending.push('<span class="coverage-chip pending">'+escapeHtml(client)+'</span>');
        }
      });

      var card = document.createElement("div");
      card.className = "coverage-tech-card";
      card.innerHTML =
        '<div class="coverage-tech-head">' +
          '<span class="tech-chip" style="background:'+t.color+'">'+escapeHtml(t.name)+'</span>' +
          '<span class="coverage-ratio">'+visited.length+' de '+shownClients.length+' clientes</span>' +
        '</div>' +
        '<div class="coverage-section-title">'+ic('check-circle')+' Já esteve em</div>' +
        '<div class="coverage-chip-row">'+(visited.length? visited.join("") : '<span class="coverage-empty">Nenhum cliente ainda</span>')+'</div>' +
        '<div class="coverage-section-title">'+ic('circle-dashed')+' Ainda não esteve</div>' +
        '<div class="coverage-chip-row">'+(pending.length? pending.join("") : '<span class="coverage-empty">Já passou por todos</span>')+'</div>';
      wrap.appendChild(card);
    });

    container.appendChild(wrap);
  }

  /* ============ Render principal ============ */
  function renderAll(){
    renderTabs();

    var app = document.getElementById("app");
    app.innerHTML = "";
    // O Resumo 16:9 (renderSummary) fica só no link de TV (?tv=1); a tela Início do app é o painel original.
    var tvDash = TV_MODE && state.view==="dashboard";
    app.style.width = tvDash ? "100%" : "";
    app.style.maxWidth = tvDash ? "none" : "";
    app.style.padding = tvDash ? "8px" : "";
    document.body.classList.toggle("resumo-fit", tvDash);
    if(state.view==="dashboard"){ if(TV_MODE) renderSummary(app); else renderDashboard(app); }
    else if(state.view==="daily") renderDaily(app);
    else if(state.view==="weekly") renderWeekly(app);
    else if(state.view==="monthly") renderMonthly(app);
    else if(state.view==="list") renderList(app);
    else if(state.view==="coverage") renderCoverage(app);
  }

      '<div class="field"><label>Técnico</label>' +
        '<span class="tech-chip" style="background:'+tech.color+'">'+escapeHtml(tech.name)+'</span></div>' +
      '<div class="field"><label>Cliente</label><div>'+escapeHtml(clientLabel(a))+'</div></div>' +
      (addr ? '<div class="field"><label>Endereço</label><div>'+ic('pin')+' '+escapeHtml(addr)+'</div></div>' : '') +
      '<div class="field-row">' +
        '<div class="field"><label>Data início</label><div>'+fmtDateLong(a.start)+'</div></div>' +
        '<div class="field"><label>Data fim</label><div>'+fmtDateLong(a.end)+'</div></div>' +
      '</div>' +
      '<div class="field"><label>Status</label><div><span class="status-badge status-'+a.status+'">'+STATUS_LABELS[a.status]+'</span></div></div>' +
      '<div class="field"><label>Tipo de cobertura</label><div><span class="coverage-tag">'+COVERAGE_ICON[a.coverage]+' '+COVERAGE_LABELS[a.coverage]+'</span></div></div>' +
      (a.horario ? '<div class="field"><label>Horário</label><div>'+ic('clock')+' '+escapeHtml(a.horario)+'</div></div>' : '') +
      '<div class="field"><label>Responsável</label><div>'+escapeHtml(a.responsible||"—")+'</div></div>' +
      '<div class="field"><label>Observações</label><div>'+escapeHtml(a.notes||"—")+'</div></div>';
    overlay.classList.add("open");
  }

  function openModal(id){
    if(READ_ONLY){ openDetailModal(id); return; }
    document.getElementById("detailBody").style.display = "none";
    document.getElementById("detailActions").style.display = "none";
    document.getElementById("activityForm").style.display = "block";
    var editing = id ? state.assignments.find(function(x){ return x.id===id; }) : null;
    populateTechSelect(editing ? editing.techId : null);
    populateClientList();
    document.getElementById("btnDelete").style.display = id ? "inline-flex":"none";
    if(id){
      var a = state.assignments.find(function(x){ return x.id===id; });
      if(!a) return;
      state.editingId = id;
      document.getElementById("modalTitle").textContent = "Editar período";
      document.getElementById("f-tech").value = a.techId;
      document.getElementById("f-status").value = a.status;
      document.getElementById("f-client").value = a.client;
      document.getElementById("f-site").value = a.site||"";
      document.getElementById("f-start").value = a.start;
      document.getElementById("f-end").value = a.end;
      document.getElementById("f-coverage").value = a.coverage;
      document.getElementById("f-responsible").value = a.responsible||"";
      document.getElementById("f-horario").value = a.horario||"";
      document.getElementById("f-notes").value = a.notes||"";
    } else {
      state.editingId = null;
      document.getElementById("modalTitle").textContent = "Novo período";
      form.reset();
      var d0 = (state.view==="daily"||state.view==="weekly") ? state.currentDate : T;
      document.getElementById("f-start").value = d0;
      document.getElementById("f-end").value = d0;
      document.getElementById("f-status").value = "provisionado";
      document.getElementById("f-coverage").value = "treinamento";
      if(state.techFilter!=="all") document.getElementById("f-tech").value = state.techFilter;
    }
    overlay.classList.add("open");
    setTimeout(function(){ document.getElementById("f-client").focus(); }, 30);
  }
  function closeModal(){ overlay.classList.remove("open"); state.editingId = null; }

  document.getElementById("btnCloseDetail").onclick = closeModal;
  if(!READ_ONLY) document.getElementById("btnNewActivity").onclick = function(){ openModal(null); };
  document.getElementById("btnCancel").onclick = closeModal;
  overlay.addEventListener("click", function(e){ if(e.target===overlay) closeModal(); });
  document.addEventListener("keydown", function(e){ if(e.key==="Escape" && overlay.classList.contains("open")) closeModal(); });

  document.getElementById("btnDelete").onclick = function(){
    if(!state.editingId) return;
    state.assignments = state.assignments.filter(function(a){ return a.id!==state.editingId; });
    saveState(); closeModal(); renderAll();
  };

  form.addEventListener("submit", function(e){
    e.preventDefault();
    var data = {
      techId: document.getElementById("f-tech").value,
      status: document.getElementById("f-status").value,
      client: document.getElementById("f-client").value.trim(),
      site: document.getElementById("f-site").value.trim(),
      start: document.getElementById("f-start").value,
      end: document.getElementById("f-end").value,
      coverage: document.getElementById("f-coverage").value,
      responsible: document.getElementById("f-responsible").value.trim(),
      notes: document.getElementById("f-notes").value.trim()
    };
    var horarioTxt = document.getElementById("f-horario").value.trim();
    if(horarioTxt){ data.horario = horarioTxt; }
    if(!data.client || !data.start || !data.end || !data.techId){ return; }
    if(data.end < data.start){ data.end = data.start; }
    if(state.editingId){
      var a = state.assignments.find(function(x){ return x.id===state.editingId; });
      Object.assign(a, data);
      if(!horarioTxt){ delete a.horario; }
    } else {
      data.id = "c" + Date.now();
      state.assignments.push(data);
    }
    saveState(); closeModal(); renderAll();
  });

  /* ============ Modo de exibição / exportação ============ */
  if(READ_ONLY){
    document.getElementById("btnNewActivity").style.display = "none";
    document.getElementById("btnExport").style.display = "none";
    document.getElementById("protoBanner").innerHTML = ic('clipboard')+' <b>Agenda dos técnicos volantes</b> — consulta apenas. Toque em qualquer período para ver os detalhes completos.';
  } else {
    document.getElementById("protoBanner").innerHTML = ic('pencil')+' <b>Modo edição</b> — use "+ Novo período" para adicionar e clique em um card para editar. Quando terminar, use "Exportar para técnicos" para gerar a versão só leitura.';
    document.getElementById("btnExport").addEventListener("click", downloadViewerCopy);
  }

  function generateViewerHtml(){
    var html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
    var newAssignmentsJson = JSON.stringify(state.assignments);
    html = html.replace(
      /\/\*ASSIGNMENTS_JSON_START\*\/[\s\S]*?\/\*ASSIGNMENTS_JSON_END\*\//,
      "/*ASSIGNMENTS_JSON_START*/" + newAssignmentsJson + "/*ASSIGNMENTS_JSON_END*/"
    );
    html = html.replace(
      "var READ_ONLY = /*READ_ONLY_FLAG*/false/*READ_ONLY_FLAG*/;",
      "var READ_ONLY = /*READ_ONLY_FLAG*/true/*READ_ONLY_FLAG*/;"
    );
    return html;
  }

  function downloadViewerCopy(){
    try{
      var html = generateViewerHtml();
      var blob = new Blob([html], {type:"text/html"});
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "agenda-tecnicos-" + T + ".html";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
    }catch(e){
      alert("Não foi possível gerar o arquivo. Tente novamente ou use um navegador desktop (Chrome/Edge).");
    }
  }

  function setSidebarHidden(h){ document.body.classList.toggle("sidebar-hidden", h); fitTvStage(); }
  document.getElementById("sidebarToggle").onclick = function(){ setSidebarHidden(false); };
  document.getElementById("sidebarHide").onclick = function(){ setSidebarHidden(true); };
  if(TV_MODE){ document.body.classList.add("tv-mode"); state.view = "dashboard"; }
  renderAll();

})();
</script>
</body>
</html>
