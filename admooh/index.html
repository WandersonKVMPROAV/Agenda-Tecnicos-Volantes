<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>KVM Pro AV | Agenda dos técnicos volantes – Admooh</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --deep:#152631; --navy:#2E4756; --teal:#38B3C2; --teal-d:#125A66; --gold:#D9A04B;
  --ok:#5FB58C; --mid:#E2AB55; --neg:#E27C6F; --plum:#A194DD; --nc:#7D929C;
  --txt:#EEF3F2; --mut:rgba(238,243,242,.66); --line:rgba(255,255,255,.13); --panel:rgba(255,255,255,.055);
  --f:Inter,"Segoe UI",Roboto,Arial,sans-serif; --fh:"Space Grotesk",Inter,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--deep);overflow:hidden;cursor:none}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(var(--s,1));
  background:radial-gradient(120% 95% at 0% 0%,#2E4756 0%,#1E3341 55%,#152631 100%);color:var(--txt);font-family:var(--f);overflow:hidden;-webkit-font-smoothing:antialiased}
.progress{position:absolute;top:0;left:0;height:6px;width:0;background:var(--gold)}
header{position:absolute;top:0;left:0;right:0;height:140px;display:flex;align-items:center;gap:36px;padding:26px 72px 0}
header img{height:58px;display:block}
.sep{width:2px;height:68px;background:var(--line)}
.ttl .t1{font:500 24px var(--f);color:var(--mut)}
.ttl .t2{font:700 48px/1.1 var(--fh);letter-spacing:-.01em;margin-top:2px}
.clock{margin-left:auto;text-align:right}
.clock .h{font:700 66px/1 var(--fh);font-variant-numeric:tabular-nums}
.clock .d{font:500 23px var(--f);color:var(--mut);margin-top:6px}
.clock .d::first-letter{text-transform:uppercase}
main{position:absolute;top:168px;left:72px;right:72px;bottom:100px}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .8s ease}
.slide.on{opacity:1}
footer{position:absolute;left:72px;right:72px;bottom:30px;height:44px;display:flex;align-items:center;gap:24px;font:500 21px var(--f);color:var(--mut)}
.nav{margin-left:auto;display:flex;gap:28px}
.nav span{padding-bottom:6px;border-bottom:4px solid transparent}
.nav span.on{color:var(--txt);border-bottom-color:var(--gold);font-weight:600}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:26px}
h3{font:700 32px/1.15 var(--fh);margin:0}
.mut{color:var(--mut)}
.leg{display:flex;gap:26px;font:500 21px var(--f);color:var(--mut);align-items:center}
.leg i{display:inline-block;width:16px;height:16px;border-radius:4px;margin-right:9px;vertical-align:-2px}
.leg i.dash{background:transparent;border:2px dashed rgba(255,255,255,.8)}
.hrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cnt{min-width:52px;height:40px;padding:0 16px;border-radius:999px;font:700 24px/40px var(--fh);text-align:center}
.pill{display:inline-block;color:#fff;font:700 20px/1 var(--f);padding:8px 18px;border-radius:999px;white-space:nowrap}
.nm{font-family:var(--fh);font-weight:700;letter-spacing:.005em}
.nm small{font:500 .72em var(--f);color:var(--mut);margin-left:.35em;text-transform:uppercase}

/* ---- slide: em campo hoje ---- */
.hoje{display:grid;grid-template-rows:190px 1fr;gap:26px;height:100%}
.kpis{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr 1.1fr;padding:20px 0}
.kpi{padding:0 32px;border-left:2px solid var(--line);display:flex;flex-direction:column;justify-content:center;min-width:0}
.kpi:first-child{border-left:0}
.kpi .v{font:700 66px/1 var(--fh);font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap}
.kpi:first-child .v{font-size:78px;color:var(--teal)}
.kpi .l{font:600 26px var(--f);margin-top:10px}
.kpi .s{font:500 21px var(--f);color:var(--mut);margin-top:3px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:24px;min-height:0}
.tc{padding:16px 26px 16px;display:flex;flex-direction:column;justify-content:center;min-width:0;min-height:0;border-left:8px solid var(--tc,var(--nc));overflow:hidden}
.tc .top{display:flex;align-items:center;gap:14px}
.tc .top .nm{font-size:32px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tc .top .pill{margin-left:auto;font-size:19px;padding:7px 16px}
.tc .cl{font:700 28px/1.15 var(--fh);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc .ad{display:flex;align-items:center;gap:7px;font:500 18px/1.25 var(--f);color:var(--mut);opacity:.9;margin-top:3px;min-width:0}
.tc .ad svg{flex:none;width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tc .ad span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tc .meta{font:500 21px/1.2 var(--f);color:var(--mut);margin-top:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc .meta b{color:var(--txt);font-weight:700}
.tc .pr{height:8px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:8px;flex:none}
.tc .pr span{display:block;height:100%;border-radius:4px}
.tc.free{border-style:dashed;border-left-style:solid}
.tc.free .cl{color:var(--teal);font-size:28px}
.am{grid-column:span 2;padding:16px 28px 14px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.am .hd{display:flex;align-items:baseline;gap:16px;margin-bottom:6px}
.am h3{font-size:28px}
.am .sub{font:500 20px var(--f);color:var(--mut)}
.am .lst{flex:1;min-height:0;display:grid;grid-auto-flow:column;grid-template-rows:repeat(4,1fr);column-gap:36px}
.am .r{display:flex;justify-content:space-between;align-items:center;gap:14px;border-top:1px solid var(--line);min-height:0;min-width:0}
.am .r .nm{font-size:21px;white-space:nowrap}
.am .r>span:first-child{display:flex;align-items:center;white-space:nowrap}
.am .r>span:last-child{font:500 20px var(--f);color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;min-width:0}
.am .r i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:10px;flex:none}

/* ---- slide: próximas semanas ---- */
.tlp{height:100%;padding:24px 34px 26px;display:flex;flex-direction:column}
.tlh{display:grid;grid-template-columns:250px 1fr;height:96px;flex:none}
.tlh .wk{display:grid;grid-template-columns:repeat(3,1fr);height:34px;font:600 21px var(--f);color:var(--mut)}
.tlh .wk div{padding-left:8px;border-left:2px solid var(--line);display:flex;align-items:center}
.tlh .dd{display:grid;grid-template-columns:repeat(15,1fr);height:60px}
.tlh .dd div{display:flex;flex-direction:column;align-items:center;justify-content:center;font:500 18px var(--f);color:var(--mut)}
.tlh .dd div b{font:700 27px/1.1 var(--fh);color:var(--txt)}
.tlh .dd div.td b{color:var(--gold)}
.tlb{position:relative;flex:1;min-height:0;margin-top:6px}
.tlg{position:absolute;left:250px;right:0;top:0;bottom:0;display:grid;grid-template-columns:repeat(15,1fr)}
.tlg div{border-left:1px solid rgba(255,255,255,.07)}
.tlg div.w1{border-left:2px solid var(--line)}
.tlg div.td{background:rgba(217,160,75,.10);box-shadow:inset 0 0 0 2px rgba(217,160,75,.55)}
.tlr{position:absolute;left:0;right:0;display:grid;grid-template-columns:250px 1fr;border-top:1px solid var(--line)}
.tlr .lab{display:flex;align-items:center;gap:12px;padding-right:14px;min-width:0}
.tlr .lab .dot{width:14px;height:14px;border-radius:50%;flex:none}
.tlr .lab .nm{font-size:27px;line-height:1.1;overflow:hidden}
.tlr .lab .nm small{display:block;margin:2px 0 0;font-size:18px}
.lane{position:relative;height:100%}
.bar{position:absolute;border-radius:14px;padding:0 14px;display:flex;align-items:center;font:700 21px var(--f);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.bar.prov{border:2px dashed rgba(255,255,255,.85);background-clip:padding-box;opacity:.88}
.bar.done{opacity:.5}
.bar.cl{border-top-left-radius:0;border-bottom-left-radius:0}
.bar.cr{border-top-right-radius:0;border-bottom-right-radius:0}

/* ---- slide: próximos períodos ---- */
.prox{display:grid;grid-template-columns:1.55fr 1fr;gap:32px;height:100%}
.prox .panel{padding:28px 34px;min-height:0;overflow:hidden}
.col{display:flex;flex-direction:column;gap:28px;min-height:0}
.col .panel{flex:1 1 0}
.col .panel:first-child{flex:1.45 1 0}
.col .panel:last-child{flex:.8 1 0}
.up{display:grid;grid-template-columns:150px 1fr 190px 96px;gap:20px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}
.up:first-of-type{border-top:0}
.up .d b{display:block;font:700 40px/1 var(--fh)}
.up .d small{font:500 19px var(--f);color:var(--mut);text-transform:uppercase}
.up .w .nm{font-size:29px}
.up .w div:last-child{font:500 23px var(--f);color:var(--mut);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up .in{text-align:right;font:700 28px var(--fh)}
.up .in small{display:block;font:500 17px var(--f);color:var(--mut)}
.bars{display:flex;flex-direction:column;gap:13px;margin-top:16px}
.bar2 .h{display:flex;justify-content:space-between;font:600 24px var(--f);margin-bottom:7px}
.bar2 .h span:last-child{font:700 26px var(--fh)}
.bar2 .tr{height:14px;border-radius:7px;background:rgba(255,255,255,.08);overflow:hidden}
.bar2 .tr span{display:block;height:100%;border-radius:7px}
.ov{padding:14px 0;border-top:1px solid var(--line)}
.ov:first-of-type{border-top:0}
.ov .t{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.ov .t .nm{font-size:27px}
.ov .t span:last-child{font:700 25px var(--fh);color:var(--neg);white-space:nowrap}
.ov .s{font:500 20px/1.3 var(--f);color:var(--mut);margin-top:4px}
.empty{display:flex;align-items:center;justify-content:center;text-align:center;height:70%;font:500 26px var(--f);color:var(--mut)}

/* ---- slide: clientes ---- */
.cli{display:grid;grid-template-rows:150px 1fr;gap:26px;height:100%}
.cs{display:flex;align-items:center;gap:36px;padding:0 44px}
.cs .big{font:700 84px/1 var(--fh);color:var(--ok)}
.cs .big span{font-size:48px;color:var(--mut)}
.cs p{margin:0;font:600 30px/1.25 var(--f)}
.cs p small{display:block;font:500 22px var(--f);color:var(--mut);margin-top:4px}
.cs .leg{margin-left:auto}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:22px;min-height:0}
.ct{padding:20px 26px;display:flex;flex-direction:column;min-width:0;border-top:6px solid var(--cc)}
.ct .n{font:700 27px/1.15 var(--fh);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ct .chip{align-self:flex-start;margin-top:10px;font:700 18px/1 var(--f);padding:7px 14px;border-radius:999px;color:#10202a;background:var(--cc)}
.ct.pend .chip{color:#fff}
.ct .i{font:500 20px/1.3 var(--f);color:var(--mut);margin-top:auto;padding-top:8px}
.ct .i b{color:var(--txt);font-weight:600}
@media (prefers-reduced-motion:reduce){.slide{transition:none}}
</style>
</head>

function nameEl(full, tag) {

/* ---------- contexto (recalculado a cada montagem) ---------- */
function mkctx() {
  const T = iso(new Date());
  const D = nextWD(T);
  const st = (a) => (a.status === 'provisionado' && a.start <= T && T <= a.end) ? 'andamento' : a.status;   /* mesma regra do app */
  const eff = (a) => a.end < T ? 'finalizado' : st(a);                                                         /* exibição: encerrado = finalizado */
  const techs = DATA.technicians.filter((t) => !t.inactive).sort((x, y) => x.name.localeCompare(y.name));
  const ids = {}; techs.forEach((t) => ids[t.id] = true);
  const tech = (id) => DATA.technicians.find((t) => t.id === id) || { id, name: '—', color: '#7D929C' };
  const open = DATA.assignments.filter((a) => eff(a) !== 'finalizado' && a.end >= D && ids[a.techId]).sort((a, b) => a.start.localeCompare(b.start));
  const onDay = (day, id) => open.find((a) => a.techId === id && a.start <= day && day <= a.end);
  return { T, D, st, eff, techs, ids, tech, open, onDay, dayTxt: D === T ? 'hoje' : 'em ' + dm(D) };
}

function visitedMap(C) {
  const m = {};
  DATA.clients.forEach((c) => { m[c] = { visited: null, next: null }; });
  DATA.assignments.forEach((a) => {
    const e = m[a.client]; if (!e) return; const s2 = C.st(a);
    if (s2 === 'finalizado' || s2 === 'andamento') { if (!e.visited || a.end > e.visited.end) e.visited = a; }
    else if (s2 === 'provisionado' && a.end >= C.T) { if (!e.next || a.start < e.next.start) e.next = a; }
  });
  return m;
}

      if (nl === 1) { b.style.top = '50%'; b.style.height = '70px'; b.style.transform = 'translateY(-50%)'; }
      else { b.style.top = 'calc(' + o.l + ' * (100% / ' + nl + ') + 6px)'; b.style.height = 'calc(100% / ' + nl + ' - 12px)'; }
      b.title = lbl(o.a) + ' (' + dm(o.a.start) + '–' + dm(o.a.end) + ')'; lane.append(b);
    });
    row.append(lane); body.append(row);
  });
  p.append(body); s.append(p);
  return { s, titulo: 'Agenda das próximas semanas', nome: 'Semanas' };
}

function telaProximos() {
  const C = mkctx(); const s = el('section', 'slide'); const g = el('div', 'prox');
  const up = C.open.filter((a) => a.start > C.D).sort((a, b) => a.start.localeCompare(b.start) || C.tech(a.techId).name.localeCompare(C.tech(b.techId).name));
  const MAX = 7;
  const p1 = el('div', 'panel'); const h = el('div', 'hrow');
  const c1 = el('span', 'cnt', String(up.length)); c1.style.cssText = 'background:rgba(161,148,221,.18);color:var(--plum)';
  h.append(el('h3', null, 'Próximos períodos'), c1); p1.append(h);
  if (!up.length) p1.append(el('div', 'empty', 'Nenhum período futuro agendado'));
  up.slice(0, MAX).forEach((a) => {
    const r = el('div', 'up'); const d = el('div', 'd'); const b = el('b', null, dm(a.start)); b.style.color = covC(a); d.append(b, el('small', null, WDL[parse(a.start).getDay()]));
    const w = el('div', 'w'); w.append(nameEl(C.tech(a.techId).name, 'div'), el('div', null, lbl(a)));
    const pc = el('div'); const pl = el('span', 'pill', covL(a)); pl.style.background = covC(a); pc.append(pl);
    const inn = el('div', 'in'); const nd = diff(C.D, a.start); inn.append(String(nd), el('small', null, plural(nd, 'dia', 'dias')));
    r.append(d, w, pc, inn); p1.append(r);
  });
  if (up.length > MAX) { const m = el('div', 'mut', '+ ' + (up.length - MAX) + ' ' + plural(up.length - MAX, 'período', 'períodos') + ' depois'); m.style.cssText = 'font:500 21px var(--f);margin-top:10px'; p1.append(m); }

  const col = el('div', 'col');
  const p2 = el('div', 'panel'); p2.append(el('h3', null, 'Próximos 30 dias'));
  const lim = addDays(C.D, 30); const sub = el('div', 'mut', 'períodos ativos ou programados, por tipo'); sub.style.cssText = 'font:500 21px var(--f);margin-top:4px'; p2.append(sub);
  const counts = {}; Object.keys(COV).forEach((k) => counts[k] = 0);
  C.open.filter((a) => a.start <= lim).forEach((a) => { if (counts[a.coverage] !== undefined) counts[a.coverage]++; });
  const mx = Math.max(1, ...Object.values(counts)); const bars = el('div', 'bars');
  Object.keys(COV).forEach((k) => { const b = el('div', 'bar2'); const hh = el('div', 'h'); hh.append(el('span', null, COV[k][0]), el('span', null, String(counts[k])));
    const tr = el('div', 'tr'); const sp = el('span'); sp.style.width = (counts[k] / mx * 100) + '%'; sp.style.background = COV[k][1]; tr.append(sp); b.append(hh, tr); bars.append(b); });
  p2.append(bars);

  const ov = [];
  C.techs.forEach((t) => { const l = C.open.filter((a) => a.techId === t.id);
    for (let i = 0; i < l.length; i++) for (let j = i + 1; j < l.length; j++) { const a = l[i], b = l[j];
      if (a.start <= b.end && b.start <= a.end) ov.push({ t, a, b, s: a.start > b.start ? a.start : b.start, e: a.end < b.end ? a.end : b.end }); } });
  ov.sort((x, y) => x.s.localeCompare(y.s));
  const p3 = el('div', 'panel'); const h3 = el('div', 'hrow'); const c3 = el('span', 'cnt', String(ov.length));
  c3.style.cssText = ov.length ? 'background:rgba(226,124,111,.18);color:var(--neg)' : 'background:rgba(95,181,140,.18);color:var(--ok)';
  h3.append(el('h3', null, 'Atenção: sobreposições'), c3); p3.append(h3);
  if (!ov.length) p3.append(el('div', 'empty', 'Nenhuma sobreposição de agenda'));
  ov.slice(0, 2).forEach((o) => { const d = el('div', 'ov'); const t = el('div', 't'); t.append(nameEl(o.t.name, 'span'), el('span', null, dm(o.s) + (o.e !== o.s ? '–' + dm(o.e) : '')));
    d.append(t, el('div', 's', lbl(o.a) + ' × ' + lbl(o.b))); p3.append(d); });
  if (ov.length > 2) { const m = el('div', 'mut', '+ ' + (ov.length - 2) + ' ' + plural(ov.length - 2, 'outra', 'outras')); m.style.cssText = 'font:500 21px var(--f);margin-top:8px'; p3.append(m); }
  col.append(p2, p3); g.append(p1, col); s.append(g);
  return { s, titulo: 'Próximos períodos', nome: 'Próximos' };
}

function telaClientes() {
  const C = mkctx(); const s = el('section', 'slide'); const g = el('div', 'cli');
  const vm = visitedMap(C); const total = DATA.clients.length;
  const vis = DATA.clients.filter((c) => vm[c].visited).length;
  const sch = DATA.clients.filter((c) => !vm[c].visited && vm[c].next).length;
  const pen = total - vis - sch;
  const top = el('div', 'panel cs'); const big = el('div', 'big', String(vis)); big.append(el('span', null, ' de ' + total));
  const p = el('p', null, plural(vis, 'cliente já coberto', 'clientes já cobertos') + ' por técnicos volantes'); p.append(el('small', null, sch + ' ' + plural(sch, 'agendado', 'agendados') + ' · ' + pen + ' sem cobertura'));
  const lg = el('div', 'leg'); [['var(--ok)', 'Atendido'], ['var(--teal)', 'Agendado'], ['var(--neg)', 'Sem cobertura']].forEach(([c, t]) => { const sp = el('span'); const i = el('i'); i.style.background = c; sp.append(i, t); lg.append(sp); });
  top.append(big, p, lg); g.append(top);
  const tiles = el('div', 'tiles');
  DATA.clients.forEach((c) => {
    const e = vm[c]; const state = e.visited ? ['Atendido', 'var(--ok)', ''] : e.next ? ['Agendado', 'var(--teal)', ''] : ['Sem cobertura', 'var(--neg)', ' pend'];
    const t = el('div', 'panel ct' + state[2]); t.style.setProperty('--cc', state[1]);
    t.append(el('div', 'n', c), el('div', 'chip', state[0]));
    const i = el('div', 'i');
    if (e.visited) { if (e.visited.end >= C.T) i.append('Em andamento até ', el('b', null, dm(e.visited.end)), ' · ' + C.tech(e.visited.techId).name.split(' ')[0]); else i.append('Última: ', el('b', null, dm(e.visited.end)), ' · ' + C.tech(e.visited.techId).name.split(' ')[0]); if (e.next) { i.append(el('br'), 'Próxima: ', el('b', null, dm(e.next.start))); } }
    else if (e.next) i.append('Próxima: ', el('b', null, dm(e.next.start)), ' · ' + C.tech(e.next.techId).name.split(' ')[0]);
    else i.append('Nenhuma visita registrada');
    t.append(i); tiles.append(t);
  });
  g.append(tiles); s.append(g);
  return { s, titulo: 'Cobertura dos clientes', nome: 'Clientes' };
}

/* ---------- escala e relógio ---------- */
function escala() { document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1920, innerHeight / 1080)); }
addEventListener('resize', escala); escala();
function relogio() { const d = new Date(); $('#hora').textContent = d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); $('#data').textContent = d.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' }); }
relogio(); setInterval(relogio, 10000);

/* ---------- rotação ---------- */
const params = new URLSearchParams(location.search);
const DUR = Math.max(5, Number(params.get('tempo')) || 15) * 1000;
const CHAVES = { hoje: telaHoje, semanas: telaSemanas, proximos: telaProximos, clientes: telaClientes };
const fixa = params.get('tela');
const ordem = fixa && CHAVES[fixa] ? [fixa] : Object.keys(CHAVES);
const main = $('#slides'); const nav = $('#nav');
let telas = [], atual = -1, fonteTxt = '';
function fonte() { $('#fonte').textContent = fonteTxt || ('Planilha Controle – Técnicos volantes, dados até ' + BUILT); }
function monta() {
  main.innerHTML = ''; nav.innerHTML = '';
  telas = ordem.map((c) => CHAVES[c]());
  telas.forEach((t) => { main.append(t.s); nav.append(el('span', null, t.nome)); });
  if (atual >= 0) pinta(atual);
}
function pinta(i) {
  telas.forEach((t, j) => t.s.classList.toggle('on', j === i));
  [...nav.children].forEach((e, j) => e.classList.toggle('on', j === i));
  $('#titulo').textContent = telas[i].titulo;
}
function mostra(i) {
  atual = i % telas.length; pinta(atual);
  const pr = $('#progress');
  if (telas.length < 2) { pr.style.width = '100%'; return; }
  pr.style.transition = 'none'; pr.style.width = '0'; void pr.offsetWidth;
  pr.style.transition = 'width ' + DUR + 'ms linear'; pr.style.width = '100%';
}
monta(); fonte(); mostra(0);
if (telas.length > 1) setInterval(() => mostra(atual + 1), DUR);

/* ---------- atualização automática a partir do app publicado ---------- */
function lerApp(txt) {
  try {
    const m = txt.match(/\/\*ASSIGNMENTS_JSON_START\*\/([\s\S]*?)\/\*ASSIGNMENTS_JSON_END\*\//); if (!m) return null;
    const assignments = JSON.parse(m[1]);
    const tb = txt.match(/var TECHNICIANS = \[([\s\S]*?)\n\s*\];/); const technicians = [];
    if (tb) { const re = /\{id:"([^"]+)",\s*name:"([^"]+)",\s*color:"(#[0-9A-Fa-f]{6})"(,\s*inactive:true)?\}/g; let x; while ((x = re.exec(tb[1]))) technicians.push({ id: x[1], name: x[2], color: x[3], inactive: !!x[4] }); }
    const cb = txt.match(/var CLIENTS = \[([\s\S]*?)\];/); const clients = cb ? [...cb[1].matchAll(/"([^"]+)"/g)].map((x) => x[1]) : [];
    const ab = txt.match(/var ADDRESSES = \{([\s\S]*?)\n\s*\};/); const addresses = {};
    if (ab) { const re = /"([^"]*)":\s*"([^"]*)"/g; let x; while ((x = re.exec(ab[1]))) addresses[x[1]] = x[2]; }
    if (!assignments.length || !technicians.length || !clients.length) return null;
    return { technicians, clients, addresses, assignments };
  } catch (e) { return null; }
}
async function atualiza() {
  try {
    const r = await fetch('../index.html?cb=' + Date.now(), { cache: 'no-store' }); if (!r.ok) return;
    const d = lerApp(await r.text()); if (!d) return;
    DATA = d; fonteTxt = 'Dados do app Agenda de Técnicos · atualizado às ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    monta(); fonte();
  } catch (e) { /* sem rede ou fora do GitHub Pages: mantém o snapshot embutido */ }
}
setTimeout(atualiza, 2500); setInterval(atualiza, 5 * 60 * 1000);
setInterval(() => { const d = new Date(); if (d.getHours() === 0 && d.getMinutes() === 0) location.reload(); }, 60000);
</script>
